# AG_R6_ECONOMIC_GATE_CONTRACT_V1 -- PROPOSED, NOT SIGNED.
#
# What this file is: a strategy-neutral, prospective definition of the minimum evidence
# and economic performance a strategy/version must demonstrate before it may become a
# CANDIDATE for Demo-eligibility consideration (R7 audit, never automatic Demo
# authorization -- see docs/status/AG_R6_ECONOMIC_GATE_OWNER_REVIEW_V1.md).
#
# What this file is NOT: active governance. status: PROPOSED below means no evaluator
# may use these numbers to produce EDGE_VALIDATED/EDGE_REJECTED for any real strategy.
# src/validation_framework/economic_gate.py fails closed (NOT_EVALUABLE_MISSING_SIGNED_
# THRESHOLDS) on any contract whose status is not SIGNED, regardless of what numbers
# this file contains. See tests/test_economic_gate_evaluator.py for that guard's proof.
#
# Threshold provenance (per-field rationale, not chosen from current strategy
# performance -- see docs/status/AG_R6_ECONOMIC_GATE_OWNER_REVIEW_V1.md for the full
# non-post-hoc-fitting discussion): each numeric value below is tagged with a
# `# source:` comment classifying where it came from. None of them were derived by
# looking at ST_ASIAN_SWEEP_5R_V1's own -1.00/-3.38 R results -- that evidence is
# reported separately in the owner-review document, never referenced here.
#
# Activation: an owner sets status to SIGNED and fills signed_by/signed_at below. This
# file is never mutated by an adapter, evaluator, or automated process -- same
# convention as config/governance/strategy_lifecycle.yaml and config/ticket_delivery.yaml's
# signed `policy:` block.

schema_version: "1"

identity:
  contract_id: AG_R6_ECONOMIC_GATE_CONTRACT_V1
  version: "1"
  status: PROPOSED   # PROPOSED | SIGNED -- only SIGNED may ever be evaluated against
  signed_by: null
  signed_at: null

# Minimum evidence volume before ANY economic claim (positive or negative) is
# considered statistically meaningful enough to inform a promotion decision.
sample:
  minimum_resolved_trades: 30        # source: EXISTING_PROJECT_CONVENTION
    # (scripts/generate_economic_evidence_report.py's own MIN_SAMPLE_FOR_ANY_CLAIM,
    # already used descriptively/non-authoritatively in this repo)
  minimum_oos_trades: 15             # source: STATISTICAL_DESIGN
    # (a held-out/out-of-sample subset large enough to detect a sign flip in
    # expectancy without being a token 1-2 trade check)

# Minimum net economic quality, computed under the SIGNED cost scenario only (never a
# gross-only figure -- see evidence.accepted_cost_statuses below).
economics:
  minimum_net_expectancy_R: 0.10     # source: RISK_DERIVED
    # (must clear zero with margin -- a strategy exactly at breakeven after friction
    # provides no capital-preservation buffer against estimation error)
  minimum_profit_factor: 1.30        # source: EXTERNAL_REFERENCE
    # (a conventional minimum-viability figure in retail systematic trading risk
    # literature; NOT a repository-derived or owner-signed figure until this contract
    # itself is signed)
  maximum_drawdown_R: 15.0           # source: RISK_DERIVED
    # (bounded relative to this strategy family's per-trade 0.5% risk_per_trade_pct
    # convention -- strategies/ST_ASIAN_SWEEP_5R_V1.yaml -- a portfolio-level policy
    # choice, not derived from any one strategy's observed drawdown)

# Robustness requirements beyond a single in-sample expectancy figure.
robustness:
  walk_forward_required: true        # source: STATISTICAL_DESIGN
  minimum_walk_forward_windows: 3    # source: STATISTICAL_DESIGN
  friction_stress_required: true     # source: RISK_DERIVED
    # (must remain net-positive under the signed CONTRACT_CEILING cost scenario, not
    # merely under an unmodeled/optimistic friction assumption)
  maximum_friction_degradation_pct: 50   # source: RISK_DERIVED
    # (net expectancy may not fall by more than half relative to gross before the
    # strategy is considered too friction-sensitive to promote)

# Evidence-quality preconditions the evaluator checks BEFORE any economics field above
# is even consulted.
evidence:
  required_cost_coverage: "ALL_RESOLVED_TRADES"   # source: EXISTING_PROJECT_CONVENTION
    # (matches src/performance/cost_model.py's own friction_evidence_complete check)
  accepted_cost_statuses: ["INCLUDED_CONTRACT_CEILING"]   # source: EXISTING_PROJECT_CONVENTION
    # (NOT_INCLUDED / gross-only records may never satisfy this contract's economics
    # section -- see src/performance/cost_model.py)
  allowed_market_data_modes: ["REAL"]   # source: EXISTING_PROJECT_CONVENTION
    # (matches strategy_contract/market_snapshot.py's MARKET_DATA_MODE_REAL -- REPLAY/
    # SYNTHETIC evidence may inform research but never counts toward this gate)
  require_no_lookahead_pass: true    # source: EXISTING_PROJECT_CONVENTION
  require_reproducibility_pass: true # source: EXISTING_PROJECT_CONVENTION

promotion:
  requires_evidence_complete: true
  requires_economic_gate_pass: true

# Explicitly NOT part of this contract (owner review document elaborates):
# early_rejection_rule -- a prospective, strategy-neutral rule for stopping evidence
# collection early under overwhelming negative evidence was considered (see
# docs/status/AG_R6_ECONOMIC_GATE_OWNER_REVIEW_V1.md section "Early rejection vs full
# promotion") but is NOT defined here and NOT active -- adding one now, with 13 real
# trades already on file, would risk (or appear to risk) being tuned to the current
# strategy's own results. Deferred to a separate, later, explicitly-authorized decision
# if the owner wants one.
