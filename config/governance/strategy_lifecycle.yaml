# AG-EGSVF canonical lifecycle-stage authority (AG_PROJECT_READINESS_POST_LARGE_SMC_
# PROMOTION_IMPLEMENTATION_V2, P0). This is the ONLY machine-readable record of a
# strategy's current AG-EGSVF lifecycle_stage in the repository -- before this file, each
# validation_framework adapter hardcoded its own Python literal.
#
# This file does NOT duplicate proposal_generation_authorized/demo_authorized/
# live_authorized -- those already have a canonical home (strategies/registry.yaml,
# strategies/<ID>.yaml) and are read from there unchanged. Duplicating them here would
# create a second, divergence-prone source of truth in the opposite direction. This
# registry owns exactly one fact per strategy: its current lifecycle_stage, version-
# bound to the exact semantic_version it applies to (src/validation_framework/
# lifecycle_registry.py fails closed on any version mismatch between this file and the
# adapter's own SEMANTIC_VERSION constant).
#
# Mutating lifecycle_stage here is itself a governance action -- it must only follow an
# evaluator PASS (promotion_eligible=True) plus explicit owner authorization, exactly as
# every prior AG-EGSVF promotion in this repository's history has (see
# strategies/STRATEGY_LEDGER.md's dated governance entries). This file is never mutated
# by an adapter, the evaluator, or any automated process.
schema_version: "1"

strategies:
  ST_ASIAN_SWEEP_5R_V1:
    semantic_version: "1.1.1"
    lifecycle_stage: OPERATIONAL_SHADOW

  ST_LIQUIDITY_SWEEP_RETEST_V1:
    semantic_version: "2.0.0"
    lifecycle_stage: FORWARD_RESEARCH

  ST_LARGE_SMC_V1:
    semantic_version: "1.0.7"
    lifecycle_stage: FORWARD_RESEARCH

  ST_SESSION_SWEEP_CONTINUATION_V1:
    semantic_version: "1.0.0"
    lifecycle_stage: OFFLINE_RESEARCH
