# LSMC_ACTIONABILITY_POLICY_V1 -- versioned OPERATIONAL config, not strategy YAML.
# Authority: docs/governance/OWNER_DECISIONS_2026-10-07_LSMC_ACTIONABILITY_V1.md (D1-D4, D7).
# Post-signal delivery layer only: it decides whether an already-detected ST_LARGE_SMC_V1
# opportunity is actionable at send time. It never changes detection, state transitions or
# archive records. The owner may change values here without a strategy version change;
# bump policy_version on every change so each persisted assessment names the values it used.
policy_id: LSMC_ACTIONABILITY_POLICY_V1
policy_version: 1
# D1: READY only if send_ts - trigger_bar_close_ts <= freshness_max_bars x trigger timeframe.
freshness_max_bars: 2
trigger_timeframe: M5
# D2: READY requires R_AT_SEND >= min_remaining_r (owner-signed initial value).
min_remaining_r: 1.5
