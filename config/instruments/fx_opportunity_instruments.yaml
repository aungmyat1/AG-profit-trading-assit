# FX Opportunity platform instrument contract (AG_FX_OPPORTUNITY_PLATFORM_V2).
#
# Market FACTS only -- no strategy, sizing or execution authority lives here. Read by
# src/fx_opportunity/instruments.py, which fails closed on any missing/inconsistent field.
#
# Price semantics: `point` is the broker's smallest price increment (MT5 symbol_info.point
# for a `digits`-decimal quote); `pip_size` is the conventional FX pip. For 5-digit
# (xxxUSD) quotes pip = 10 points = 0.0001; for 3-digit JPY quotes pip = 10 points = 0.01.
# Never assume 0.0001 for every pair.
#
# Time semantics: every timestamp the platform consumes is true UTC. Broker server time is
# converted to UTC by mt5.market_data through the shared server-time authority
# (src/mt5/time_authority.py: per-week effective periods per broker/server) before candles
# reach the platform; sessions come from config/canonical_sessions.yaml via the pilot config.
#
# Brokers: VTMARKETS is the owner-confirmed broker of the connected Demo terminal (server
# VTMarkets-Demo; EURUSD/GBPUSD/USDJPY digits/point read-only verified 2026-09-28, see
# docs/status/AG_FX_OPPORTUNITY_PLATFORM_V2_LIVE_VERIFICATION_STATUS.md). The live runner
# refuses a connected server not listed for the selected broker, and a non-Demo account.
# VANTAGE entries are kept as their genuine historical origin: config/mt5.yaml symbol_map
# (captured read-only 2026-09-07 on a Vantage account); no Vantage server is verified here.

schema: AG_FX_INSTRUMENTS_V1
timeframe: M15
cycles: [POST_ASIAN, POST_LONDON]

brokers:
  VTMARKETS:
    canonical_name: VT_MARKETS
    servers: [VTMarkets-Demo]
    environment: DEMO
  VANTAGE:
    canonical_name: VANTAGE
    servers: []
    environment: DEMO

instruments:
  EURUSD:
    asset_class: FX
    base_currency: EUR
    quote_currency: USD
    digits: 5
    point: 0.00001
    pip_size: 0.0001
    broker_symbols:
      VTMARKETS: {symbol: EURUSD, verified: true}
      VANTAGE: {symbol: EURUSD, verified: true}
    time_semantics: UTC
    allowed_cycles: [POST_ASIAN, POST_LONDON]
    minimum_history: COMPLETE_REFERENCE_SESSION
  GBPUSD:
    asset_class: FX
    base_currency: GBP
    quote_currency: USD
    digits: 5
    point: 0.00001
    pip_size: 0.0001
    broker_symbols:
      VTMARKETS: {symbol: GBPUSD, verified: true}
      VANTAGE: {symbol: GBPUSD, verified: true}
    time_semantics: UTC
    allowed_cycles: [POST_ASIAN, POST_LONDON]
    minimum_history: COMPLETE_REFERENCE_SESSION
  USDJPY:
    asset_class: FX
    base_currency: USD
    quote_currency: JPY
    digits: 3
    point: 0.001
    pip_size: 0.01
    broker_symbols:
      VTMARKETS: {symbol: USDJPY, verified: true}
      VANTAGE: {symbol: USDJPY, verified: false}
    time_semantics: UTC
    allowed_cycles: [POST_ASIAN, POST_LONDON]
    minimum_history: COMPLETE_REFERENCE_SESSION
