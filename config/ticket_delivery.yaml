# Ticket-delivery scheduler integration mode
# (AG_STAGE1_EXACTLY_ONCE_FX_TICKET_DELIVERY_V1)
#
# Status history:
#   2026-09-08  integration introduced          -- src/ticket_delivery/scheduler_integration.py
#                                                    wired into scripts/run_post_asian_pilot.py,
#                                                    shipped DISABLED (no-op).
#   2026-09-08  archive-only activated          -- mode changed to ARCHIVE_ONLY under explicit
#                                                    owner authorization, gated by the signed
#                                                    `policy:` block below.
#   --          message delivery NOT authorized -- MESSAGE_DELIVERY remains inert here
#                                                    (mode stays ARCHIVE_ONLY below);
#                                                    activating it is a separate, later,
#                                                    explicitly-authorized change (WP7).
#   2026-09-08  WP7 runtime implemented,           -- src/ticket_delivery/telegram_adapter.py
#               NOT activated                         gained deliver_informational_ticket_with_retry()
#                                                       (retry design A: in-process wait/retry,
#                                                       sleep [30, 60]s, 3 total attempts) and
#                                                       scheduler_integration.py now lazily
#                                                       constructs a real deliver() closure IF
#                                                       AND ONLY IF mode == MESSAGE_DELIVERY. The
#                                                       `telegram_destination.authorized_chat_ids`
#                                                       allow-list below is intentionally left
#                                                       empty -- it is a separate, later,
#                                                       explicitly-authorized decision to populate
#                                                       it. `mode` here remains ARCHIVE_ONLY; this
#                                                       change is additive/inert until both that
#                                                       allow-list is populated AND mode is
#                                                       separately changed to MESSAGE_DELIVERY.
#
# Read by src/ticket_delivery/scheduler_integration.py::load_integration_config().
#
# mode: DISABLED
#   No ticket_delivery call at all. Reverting this single line to DISABLED is the
#   complete, immediate rollback for this entire integration -- the `policy:` block
#   below is never read or required in this mode, even if it is invalid.
#
# mode: ARCHIVE_ONLY   (current value)
#   Archives every completed cycle decision (READY/WATCH/NO_TRADE/DATA_ERROR/BLOCKED)
#   and registers READY ticket identity, gated by the signed CatchUpPolicy below. Zero
#   network/Telegram calls -- enforced structurally in scheduler_integration.py, not
#   just by this config value. Whenever mode != DISABLED, the `policy:` block below is
#   REQUIRED and strictly validated; a missing/invalid policy value produces a nonzero
#   scheduler exit (never a silent no-op), because the operator has unambiguously asked
#   to activate ticket delivery.
#
# mode: MESSAGE_DELIVERY
#   NOT AUTHORIZED. As of this file's introduction, MESSAGE_DELIVERY behaves
#   IDENTICALLY to ARCHIVE_ONLY (see scheduler_integration.py's module docstring) --
#   real Telegram delivery requires a separate, later, explicitly-authorized code
#   change (WP7).
mode: ARCHIVE_ONLY

# Where per-cycle decisions are archived (post_asian_pilot.report_archive's existing
# atomic-write/idempotent/correction convention, unchanged).
archive_root: journal/ticket_delivery/archive

# Where the durable delivery journal (atomic claim state) lives.
delivery_state_dir: journal/ticket_delivery/state

# OWNER_APPROVED 2026-09-08 -- Stage 1 FX ticket-delivery operational policy.
# See docs/status/AG_STAGE1_CATCHUP_AND_RETRY_POLICY_DECISION_PACKET_V1.md's approval
# addendum for the full rationale, alternatives considered, and unsigned-failure
# behavior. These values apply PROSPECTIVELY to Stage 1 FX ticket operations only --
# they do not alter strategy behavior, and changing them later does not retroactively
# alter any already-archived record's identity (logical_ticket_id has no dependency on
# any of these values). Required and strictly validated whenever mode != DISABLED (see
# src/ticket_delivery/scheduler_integration.py::_parse_policy()).
policy:
  # Missed-checkpoint catch-up: a READY ticket's registration is only permitted while
  # `now - decision.ready_at <= 60 minutes`. Older than that, the decision is still
  # archived (never lost) but no ticket identity is registered (reason_code
  # OUTSIDE_CATCH_UP_WINDOW) -- see fx_cycle_integration.py's catch-up gate.
  fx_max_catch_up_age_minutes: 60

  # Total delivery attempts, INCLUDING the initial attempt (existing RetryPolicy
  # interpretation, not newly chosen here -- see _parse_policy()'s docstring). Not yet
  # exercised by any real code path: MESSAGE_DELIVERY is still inert this pass.
  delivery_max_attempts: 3

  # First retry delay. With the approved values this yields 30s, then 60s (base *
  # 2^(attempt-1)), before the 3rd (final) attempt is exhausted.
  delivery_retry_base_delay_seconds: 30

  # Upper bound on any single retry delay (the deterministic backoff never exceeds
  # this, no matter how many attempts a future, differently-configured policy allowed).
  delivery_retry_max_delay_seconds: 300

# WP7 -- the explicit Telegram destination allow-list. A SIBLING block to `policy:`
# above, deliberately kept separate from it (policy: strictly rejects any unrecognized
# field; this block does not share that contract). Read by
# src/ticket_delivery/scheduler_integration.py::_parse_authorized_chat_ids(). NEVER
# inferred from the TELEGRAM_CHAT_ID environment variable itself -- see
# src/ticket_delivery/telegram_adapter.py::TelegramDestinationConfig.from_env()'s
# docstring for why that would make "authorized" a tautology. Optional: absent or
# empty means "no destination authorized," which is the current, intentional state --
# MESSAGE_DELIVERY (itself still not activated via `mode:` above) would fail closed to
# TRANSPORT_NOT_CONFIGURED regardless of any other configuration while this is empty.
# Populating this list is a separate, later, explicitly-authorized decision.
telegram_destination:
  authorized_chat_ids: []
