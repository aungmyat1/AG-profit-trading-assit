authorization_status: OWNER_AUTHORIZED
integrity_status: HASH_RECORDED
quality_status: PASS   # H1/M15/M1 all PASS as of 2026-09-11 (was PARTIAL when M1 timezone was UNRESOLVED)

raw_common_coverage:
  h1_m15_only:
    start_utc: "2025-01-01T21:00:00+00:00"
    end_utc: "2026-06-19T20:45:00+00:00"
  h1_m15_m1_all_three:   # COMPUTED 2026-09-11 (was NOT_COMPUTABLE) -- intersection of all
    # three sources' own utc_start/utc_end, i.e. max(starts) to min(ends). M1's own
    # window (2026-05-18 to 2026-07-31) is the binding constraint on the start; M15's
    # own window (ending 2026-06-19) is the binding constraint on the end -- H1's much
    # longer window (through 2026-07-30) is never the limiting factor here.
    start_utc: "2026-05-18T06:46:00+00:00"
    end_utc: "2026-06-19T20:45:00+00:00"
    note: >-
      ~32-day common window across all three timeframes. This is the ONLY span over
      which a canonical H1-bias + M15-setup + M1-fill replay can run end to end with
      every source's own no-lookahead/closed-bar guarantee intact; it is NOT the full
      coverage of any single source. Before this window can be used for a real replay,
      also subtract required warmups (H1 structure-tier warmup, M15 EMA/ATR warmup,
      swing confirmation) per config/governance and strategies/
      ST_SESSION_SWEEP_CONTINUATION_V1.yaml's own values -- not computed here.

replay_data_readiness: TIER_A_FULL_CANONICAL_REPLAY_DATA_READY   # was TIER_B_FUNCTIONAL_RESEARCH;
  # H1 bias + M15 setup + M1 fill are now all individually data-ready (metadata
  # authorized, timezone resolved) and jointly overlap for ~32 days (see
  # raw_common_coverage.h1_m15_m1_all_three above). This field describes DATA
  # readiness only -- it is not an economic verdict and does not itself authorize a
  # replay run (a separate task); see economic_evidence_sufficiency below, unchanged.
economic_evidence_sufficiency: NOT_EVALUATED   # separate dimension; not assessed by this manifest --
  # unchanged by this update: no economic replay was run or implied by resolving these
  # two data blockers

