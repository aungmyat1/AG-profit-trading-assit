# ST_SESSION_SWEEP_CONTINUATION_V1 v1.0.0 (OFFLINE_RESEARCH) -- EURUSD.
#
# This is NEW (P44): no prior combined-package manifest existed in this repository;
# only single-file manifests (see EURUSD_M5_202504211715_202607310000.yaml, the one
# pre-existing owner-approved dataset). This file follows that directory's existing
# YAML-shape convention, extended to bind three per-timeframe sources into one
# reproducible package identity, per this task's own spec (P40-P44).
#
# Authorization: owner blanket D:\ FX authorization (2026-09-10). Integrity: each
# source's own sha256 is recorded in its own per-file manifest in this same directory
# (EURUSD_H1_202501020000_202607310000.yaml, EURUSD_M15_202501020000_202606192345.yaml,
# EURUSD_M1_202605180946_202607312356.yaml) and re-bound here. Quality: see those files'
# own quality_status fields -- H1/M15/M1 all PASS.
#
# UPDATE 2026-09-11 (AG_DAILY_SESSION_TRADE_CONTINUATION): both remaining blockers this
# package originally recorded are now resolved by explicit owner decision:
#   (1) H1 symbol-metadata authorization -- config/historical_datasets/
#       EURUSD_H1_symbol_metadata.yaml is now authority=OWNER_APPROVED_DATASET_MANIFEST
#       (tick_size=0.00001), enabling market_structure.tiers.analyze_structure_tiers /
#       market_intelligence.bias_resolver.resolve_from_structure_tiers historically.
#   (2) M1 timezone -- src/mt5/broker_time.py's offset_from_reopen tolerance was widened
#       (0.01h -> 0.05h, evidence-justified, see that module's own comment) and the M1
#       source above now resolves BROKER_OFFSET_CONFIRMED (+3h), matching the rest of
#       this broker export family. See EURUSD_M1_202605180946_202607312356.yaml for the
#       full derivation.
#
# Any future replay evidence for this strategy/symbol should bind:
#   strategy_id=ST_SESSION_SWEEP_CONTINUATION_V1, strategy_version=1.0.0,
#   dataset_id=ST_SESSION_SWEEP_CONTINUATION_V1_EURUSD_PACKAGE,
#   dataset_fingerprint=<combined_dataset_fingerprint below>,
#   replay_engine_version=<src/session_sweep_continuation/replay.py commit/version>.

