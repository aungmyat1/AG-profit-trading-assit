# AG_TRADE_ASSISTANT_V1_0_3: an APPLICATION release manifest, not a strategy release.
# RELEASE_CANDIDATE only -- this file freezes a description of the already-implemented,
# already-tested source baseline at git_head be5d31a (branch main) so operational
# validation (preflight, then proposal-only shadow evidence) can run against a stable,
# named contract. Creating this manifest does NOT promote V1.0.3 to RELEASED and does
# NOT authorize any execution, shadow-collection, or research work by itself -- see
# scope_freeze and release_qualification_gates below.
#
# AG_TRADE_ASSISTANT_V1_0.yaml, AG_TRADE_ASSISTANT_V1_0_1.yaml, and
# AG_TRADE_ASSISTANT_V1_0_2.yaml are left byte-for-byte unchanged and remain
# independently loadable/reproducible. V1.0.2 remains the CURRENT DOCUMENTED RELEASE
# (docs/VERSION_HISTORY.md) and the default release_path consumed by
# src/post_asian_pilot/pilot_config.py and src/post_asian_pilot/preflight.py; this
# manifest is not wired into that runtime and does not change its default.
#
# This manifest is descriptive/configurational authority over the application release
# only. It is NOT trading authorization: a proposal, a strategy registration, this
# manifest, API credentials, test success, broker/demo/Testnet connectivity, account
# balance, configuration files, or prior user approval are never, individually or
# together, execution authorization. Every broker order send continues to require the
# existing, unmodified execution/executor.py explicit user_confirmed=True boundary.

release_id: AG_TRADE_ASSISTANT_V1_0_3
status: RELEASE_CANDIDATE
release_date: "2026-09-03"
supersedes: AG_TRADE_ASSISTANT_V1_0_2
source_baseline:
  git_head: be5d31a54633173f7a9f1ad5710b46e5188c691d
  branch: main
  note: >-
    Reflects the tested source tree at this commit only. Untracked/pre-existing
    working-tree files present at manifest-freeze time (crypto execution scaffolding
    under src/execution/crypto_*.py, scripts/scheduled/, and
    docs/status/AG_PROJECT_OBJECTIVE_ACCELERATION_V1_SECURITY_STATUS.md) are NOT part
    of this baseline and are not described by this manifest. During this manifest-
    freeze task, an out-of-band commit (506d8b57469cc8825ecc926e50b67c043d8ba88a,
    "Add comprehensive tests for crypto execution modules") was made in this
    environment -- not by this task/session -- capturing exactly those pre-existing
    files. Diffed and confirmed: it touched none of strategies/, config/pilot/, or
    config/releases/, so it does not affect any fact pinned by this manifest.

# ---------------------------------------------------------------------------------
# Application authority matrix -- existing project vocabulary, meaning unchanged.
# ---------------------------------------------------------------------------------
application_capabilities:
  ANALYSIS: AVAILABLE
  FX_PROPOSALS: PROPOSAL_ONLY
  FX_DEMO_EXECUTION: IMPLEMENTED_BUT_DISABLED_BY_DEFAULT   # execution/executor.py demo path exists,
                                                             # gated by config/trading.yaml + explicit
                                                             # user_confirmed=True; unchanged by this release
  FX_LIVE_EXECUTION: DISABLED
  BTC_RESEARCH_PROPOSALS: RESEARCH_ONLY
  BTC_EXECUTION: NOT_IMPLEMENTED                            # execution.adapter.CryptoExecutionAdapter
  LARGE_SMC: RESEARCH_ONLY
  AUTOMATIC_EXECUTION: DISABLED
  ready_restart_recovery: true            # unchanged from V1.0.2
  immutable_asian_snapshots: true         # unchanged from V1.0.2
  dedicated_preflight_cli: true           # unchanged from V1.0.2
  event_driven_watch_output: true         # unchanged from V1.0.2
  complete_entry_ticket: true             # unchanged from V1.0.2
  end_of_window_report: true              # unchanged from V1.0.2
  monitoring_counters: true               # unchanged from V1.0.2
  execution_integration: NOT_WIRED        # unchanged from V1.0.2

execution_authorization_invariant: >-
  A proposal is never execution authorization. Neither is this manifest, strategy
  registration, API credentials, test success, broker/demo/Testnet connectivity,
  account balance availability, configuration files, or prior user approval. Every
  broker order send requires a fresh, explicit, non-defaulted user_confirmed=True
  passed to execution/executor.py::execute() for that specific call. This release
  does not weaken that boundary.

# ---------------------------------------------------------------------------------
# Domain 1 -- FX day-trading strategy authority (ST_ASIAN_SWEEP_5R_V1 v1.1.1).
# Two independently operated, independently isolated proposal-only cycles.
# Strategy rules (qualification, sweep, direction, entry, stop, target, risk,
# session semantics) are NOT reproduced here -- see strategy_source_path.
# ---------------------------------------------------------------------------------
fx_day_trading_strategy:
  id: ST_ASIAN_SWEEP_5R_V1
  version: "1.1.1"
  authority: SOLE_DAY_TRADING_STRATEGY   # pilot-scoped, per strategies/registry.yaml
  strategy_source_path: strategies/ST_ASIAN_SWEEP_5R_V1.yaml
  strategy_registry_source: strategies/registry.yaml
  demo_authorized: false   # strategies/registry.yaml -- independently blocked by open
                            # STRATEGY_LEDGER.md contract gaps, unrelated to this release
  live_authorized: false

fx_universe:
  EURUSD: ENABLED
  GBPUSD: ENABLED

fx_cycles:
  ASIAN_LONDON:
    strategy_authority: "ST_ASIAN_SWEEP_5R_V1 v1.1.1"
    pilot_id: AG_POST_ASIAN_LONDON_PILOT_V1_0_1
    pilot_source_path: config/pilot/AG_POST_ASIAN_LONDON_PILOT_V1_0_1.yaml
    reference_session:
      source: config/canonical_sessions.yaml
      name: asian
    execution_window_utc: { start: "07:00", end: "11:00" }
    state_dir: journal/post_asian_pilot          # default -- src/post_asian_pilot/store.py::DEFAULT_STATE_DIR
    ledger: journal/post_asian_pilot (DailyTradeLedger, keyed strategy_id+date)
    quota: { max_new_trades_per_day: 2, max_new_trades_per_symbol_per_day: 1 }
    execution:
      mode: PROPOSAL_ONLY
      automatic_execution: false
      explicit_confirmation_required: true
      live_execution: false

  LONDON_NEWYORK:
    strategy_authority: "ST_ASIAN_SWEEP_5R_V1 v1.1.1"
    pilot_id: AG_POST_LONDON_NEWYORK_PILOT_V1_0_1
    pilot_source_path: config/pilot/AG_POST_LONDON_NEWYORK_PILOT_V1_0_1.yaml
    reference_session:
      source: config/canonical_sessions.yaml
      name: london_am
    execution_window_utc: { start: "12:00", end: "15:00" }
    state_dir: journal/post_london_newyork_pilot   # explicit in pilot config -- isolated from ASIAN_LONDON
    ledger: journal/post_london_newyork_pilot (DailyTradeLedger, keyed strategy_id+date, separate process/state_dir)
    quota: { max_new_trades_per_day: 2, max_new_trades_per_symbol_per_day: 1 }
    execution:
      mode: PROPOSAL_ONLY
      automatic_execution: false
      explicit_confirmation_required: true
      live_execution: false

  isolation_note: >-
    ASIAN_LONDON and LONDON_NEWYORK are independently operated processes, each against
    its own state_dir/ledger (config/pilot/AG_POST_LONDON_NEWYORK_PILOT_V1_0_1.yaml's own
    header comment). DailyTradeLedger's capacity key is strategy_id+date only, not
    cycle-aware, so cross-cycle isolation depends entirely on running each cycle against
    its own state_dir -- this is existing, tested behavior, not redesigned by this
    manifest. EURUSD/GBPUSD may each be SELECTED once per cycle per day (max 2/symbol/day,
    4/day total across both symbols and both cycles) -- this is not a shared single
    logical opportunity quota.

fx_risk_reference:
  source: config/pilot/AG_POST_ASIAN_LONDON_PILOT_V1_0_1.yaml and
    config/pilot/AG_POST_LONDON_NEWYORK_PILOT_V1_0_1.yaml (identical risk blocks,
    verified against strategies/ST_ASIAN_SWEEP_5R_V1.yaml's shared
    risk_and_money_management / position_split_and_targets contract; not reproduced
    here to avoid a second source of truth)

# ---------------------------------------------------------------------------------
# Domain 2 -- BTC research runtime (ST_LIQUIDITY_SWEEP_RETEST_V1 v2.0.0, CRYPTO_PERP
# profile). Research/proposal-only. No execution authority.
# ---------------------------------------------------------------------------------
btc_research_runtime:
  strategy_id: ST_LIQUIDITY_SWEEP_RETEST_V1
  strategy_version: "2.0.0"
  strategy_status: ACTIVE_INCUBATION
  strategy_source_path: strategies/ST_LIQUIDITY_SWEEP_RETEST_V1.yaml
  instrument: BTCUSDT
  runtime: src/btc_sweep_research/ (multi-occurrence enumeration; qualification
    separated from tradability guard state)
  research_ledger: journal/btc_sweep_research/occurrences.json
  execution_domain: CRYPTO_RESEARCH
  execution_authority: DISABLED
  crypto_execution_adapter: NOT_IMPLEMENTED   # execution.adapter.CryptoExecutionAdapter;
                                                # execution.executor.execute() rejects any
                                                # non-TradeCommand object before reading fields

  # Three independent concepts (AG_PROJECT_OBJECTIVE_ACCELERATION_V1_0_3, 2026-09-03
  # owner decision) -- do not collapse them into one field:
  #   STRATEGY AUTHORITY  = ST_LIQUIDITY_SWEEP_RETEST_V1 v2.0.0 (above)
  #   MARKET-DATA AUTHORITY = Bybit (this section)
  #   EXECUTION AUTHORITY = DISABLED (execution_domain/execution_authority above)
  # Selecting Bybit as market-data authority does NOT authorize Bybit order submission,
  # account mutation, leverage changes, position management, or wallet operations.
  qualification_exception:
    id: V1_0_3_BYBIT_QUALIFICATION_EXCEPTION
    status: APPROVED_READ_ONLY_ONLY
    classification: EXISTING_RELEASE_QUALIFICATION_CAPABILITY_COMPLETION   # not
      # GENERAL_FEATURE_EXPANSION, not CRYPTO_EXECUTION_ENABLEMENT, not
      # STRATEGY_SEMANTIC_CHANGE
    approved_by: owner (direct instruction, 2026-09-05, this milestone --
      AG_V1_0_3_BYBIT_QUALIFICATION_EXCEPTION_AND_BTC_DAILY_DECISION_V3)
    authorized_scope:
      - registration reconciliation (strategies/registry.yaml <-> STRATEGY_LEDGER.md)
      - public unauthenticated Bybit BTC market data (BTCUSDT linear USDT perpetual)
      - deterministic market-data quality validation
      - existing BTC research-engine wiring (no strategy rule change)
      - BTC daily research decision + immutable observation archive
      - focused governance/implementation/provenance commits, not pushed
    forbidden_scope:
      - private/authenticated Bybit endpoints
      - order creation/checking/submission/modification/cancellation
      - wallet/deposit/withdrawal/transfer operations
      - demo/live/automatic crypto execution
      - BTC or FX strategy-semantic changes
      - FX session/risk/quota/proposal-logic changes
      - geographic/provider restriction circumvention
    observation_campaign_note: does not itself authorize the 30-day observation
      campaign start -- that requires separate authorization after production
      validation passes (see release_qualification_gates.btc below)
  btc_market_data_authority:
    source: BYBIT
    decision_status: FROZEN_BY_OWNER
    target_instrument: Bybit USDT-margined linear BTC perpetual, canonical symbol
      BTCUSDT (verified against Bybit's official V5 instruments-info documentation,
      2026-09-05 -- see execution_runtime.bybit_linear_perp_feed's own module docstring)
    adapter_status: IMPLEMENTED   # src/execution_runtime/bybit_linear_perp_feed.py,
      # AG_V1_0_3_BYBIT_QUALIFICATION_EXCEPTION_AND_BTC_DAILY_DECISION_V3 (2026-09-05);
      # public/read-only only -- no auth, no order/wallet endpoint anywhere in it
    observation_contract: docs/contracts/AG_BTC_DAILY_OBSERVATION_CONTRACT_V1.md
      # UTC calendar day, half-open [00:00:00Z, next-day 00:00:00Z), report target
      # 00:05-00:15 UTC next day -- frozen, no strategy-timing conflict found
    current_environment_access: BLOCKED_OR_ENVIRONMENT_DEPENDENT
    current_environment_evidence: >-
      Bybit public market-data endpoint (api.bybit.com) returned HTTP 403 from this
      development environment, 2026-09-03 -- explicit CloudFront country-block message
      ("configured to block access from your country"), the same class of restriction
      already recorded for Binance production (HTTP 451). No circumvention attempted or
      authorized. Production Bybit market-data acquisition requires a permitted
      environment; this is an environment constraint, not an unresolved source-selection
      decision -- source selection is FROZEN_BY_OWNER above. Re-tested 2026-09-05
      (AG_V1_0_3_BYBIT_QUALIFICATION_EXCEPTION_AND_BTC_DAILY_DECISION_V3, using the
      now-implemented adapter's own base URL): identical result, HTTP 403, same
      CloudFront country-block message. Still an environment constraint, not
      circumvented.
    execution_domain_independence_note: >-
      execution_domain=CRYPTO_RESEARCH / BINANCE_USDTM (crypto execution scaffolding
      elsewhere in this repo, src/execution/crypto_*.py) names Binance as an execution
      INFRASTRUCTURE capability only, unrelated to and not implying Binance is
      strategy-quality BTC market-data authority. That role now belongs to Bybit, per
      the owner decision above. A future valid architecture may combine
      market_data_source=BYBIT with execution_domain=BINANCE_USDTM -- these remain
      independent concerns; this manifest does not authorize or implement that
      combination.

  connectivity_evidence:
    source: docs/status/AG_COMPLETE_TRADE_OPPORTUNITY_V1_REMEDIATION_STATUS.md (Gap 6, recorded 2026-09-02)
    finding: >-
      Recorded operational evidence, not a fresh connectivity test performed by this
      manifest-freeze task: production Binance USDT-M market-data access
      (fapi.binance.com /fapi/v1/exchangeInfo and /fapi/v1/klines) returned HTTP 451
      ("restricted location") from that development environment. Binance is no longer
      the frozen BTC market-data authority (see btc_market_data_authority above) --
      this finding is retained as historical/infrastructure evidence only.
    testnet_note: >-
      Binance Futures Testnet and Bybit testnet connectivity/read evidence, where
      either exists, is infrastructure evidence only and MUST NOT count as
      production-market strategy validation evidence.

# ---------------------------------------------------------------------------------
# Domain 3 -- Large-SMC research domain (ST_LARGE_SMC_V1 v1.0.6). Independent
# strategy family; no proposal/demo/live/execution/risk-sizing authority.
# ---------------------------------------------------------------------------------
large_smc_research:
  strategy_id: ST_LARGE_SMC_V1
  strategy_version: "1.0.6"
  strategy_status: RESEARCH_DRAFT
  strategy_source_path: strategies/ST_LARGE_SMC_V1.yaml
  independence_note: >-
    Fully independent strategy family (strategies/registry.yaml) -- does not inherit
    ST_ASIAN_SWEEP_5R_V1's, SMC_3R_V1's, or ST_LIQUIDITY_SWEEP_RETEST_V1's authority or
    validation evidence.
  historical_metadata_decoupling: IMPLEMENTED   # REPLAY_METADATA_DECOUPLING_V1,
    # docs/status/ST_LARGE_SMC_V1_REPLAY_METADATA_DECOUPLING_V1_STATUS.md
  corrected_replay_baseline_recorded: true
  pending_entry_lifecycle: RESOLVED_BY_REUSE    # v1.0.6, OUTCOME_LIFECYCLE_V1

  # Owner decision recorded 2026-09-03 (AG_PROJECT_OBJECTIVE_ACCELERATION_V1_0_3).
  # This is a CONCEPTUAL model decision only -- it does not implement, freeze, or
  # authorize C10. The engine's own runtime behavior (BLOCKED /
  # UNSIGNED_CONTRACT:C10_BROKER_STOP for every candidate reaching entry-available
  # state) is UNCHANGED by this manifest. See
  # docs/status/ST_LARGE_SMC_V1_C10_STOP_LOSS_DECISION_PACKET.md for the three
  # options this decision selected among; buffer/min-distance/ATR/tick-offset
  # semantics remain separate, not-yet-made strategy-contract decisions.
  c10_broker_stop_loss:
    owner_decision: AG_NATIVE_INVALIDATION
    structural_stop_source: invalidation_price   # SMCEntryCombinationResult.invalidation_price,
                                                    # reused verbatim, not recomputed
    conceptual_model: >-
      final stop = invalidation_price plus an explicitly signed safety buffer/minimum-
      distance constraint (not yet specified); risk sizing calculated only after the
      final stop is known; the stop must never be moved closer merely to increase
      position size.
    implementation_status: PENDING       # next milestone: ST_LARGE_SMC_V1_C10_AG_NATIVE_CONTRACT_FREEZE
    contract_freeze_status: PENDING
    lifecycle_simulation_status: NOT_STARTED
    engine_runtime_status: UNSIGNED_BLOCKED   # unchanged -- still fails closed until implemented
  proposal_generation_authorized: false
  demo_authorized: false
  live_authorized: false
  execution_authority: NONE
  risk_sizing_authority: NONE

# ---------------------------------------------------------------------------------
# Scope freeze
# ---------------------------------------------------------------------------------
scope_freeze:
  invariant: >-
    V1.0.3 accepts only defect fixes discovered during release validation. New
    symbols, new asset classes, new strategy filters, new trading techniques,
    dashboard work, desktop/Windows packaging, crypto demo execution, real-account
    execution, automatic execution, Large-SMC C10 resolution, strategy optimization,
    unrelated refactoring, and unrelated architecture redesign are out of scope for
    V1.0.3 and belong to a later release or research milestone.
  strategy_semantics_changed: false
  strategy_versions_changed: false
  risk_semantics_changed: false
  session_semantics_changed: false
  execution_gates_changed: false
  new_capabilities_added: false

