# AG_TRADE_ASSISTANT_V1_0_1: inherits AG_TRADE_ASSISTANT_V1_0 strategy semantics
# completely. config/releases/AG_TRADE_ASSISTANT_V1_0.yaml is left byte-for-byte
# unchanged and remains independently reproducible/loadable -- this is a new release,
# not a mutation.
#
# Operational changes: a two-slot daily opportunity ledger (both EURUSD and GBPUSD may
# be selected the same day, one slot each) plus a deterministic exact-timestamp
# slot-ordering priority. See config/pilot/AG_POST_ASIAN_LONDON_PILOT_V1_0_1.yaml and
# src/post_asian_pilot/governor.py for the full contract.

release_id: AG_TRADE_ASSISTANT_V1_0_1
status: PILOT
supersedes: AG_TRADE_ASSISTANT_V1_0

day_trading_strategy:
  id: ST_ASIAN_SWEEP_5R_V1
  version: "1.1.1"
  authority: SOLE_DAY_TRADING_STRATEGY

universe:
  EURUSD: ENABLED
  GBPUSD: ENABLED

reference_session:
  source: config/canonical_sessions.yaml
  name: ASIAN

active_cycle:
  id: ASIAN_LONDON
  start_utc: "07:00"
  end_utc: "11:00"

risk:
  risk_per_trade_pct: 0.5
  max_open_positions: 2
  max_new_trades_per_day: 2
  max_new_trades_per_symbol_per_day: 1
  max_aggregate_open_risk_pct: 1.0
  strategy_loss_lock_r: -1.0

# NEW in V1.0.1: a two-slot daily opportunity ledger + deterministic exact-timestamp
# slot-ordering priority -- see config/pilot/AG_POST_ASIAN_LONDON_PILOT_V1_0_1.yaml and
# src/post_asian_pilot/governor.py::DailyTradeLedger for the full contract.
selection_policy:
  timestamp_source: qualifying_closed_m15   # ready_at, never evaluation_time
  winner_policy: earliest_ready_multi_slot
  max_slots: 2
  max_slots_per_symbol: 1
  exact_timestamp_priority: [EURUSD, GBPUSD]
  slot_consumption:
    on_selection: true
    release_on_expiry: false
    release_on_decline: false

features:
  session_trade: true
  SMC_advisory: false
  order_flow_advisory: false
  Large_SMC_entries: false
  crypto: false

execution:
  proposal_generation: true
  mode: PROPOSAL_ONLY
  explicit_confirmation_required: true
  automatic_execution: false
  live_execution: false
