# AG_TRADE_ASSISTANT_V1_0_2: an APPLICATION release, not a strategy release. Wraps the
# exact same portfolio/risk policy as AG_TRADE_ASSISTANT_V1_0_1 (config/pilot/
# AG_POST_ASIAN_LONDON_PILOT_V1_0_1.yaml is reused unchanged -- no new pilot policy file
# was created, because no risk/portfolio number changed). This release only adds
# operational capabilities: READY restart recovery, immutable Asian snapshots, a
# dedicated --preflight CLI, event-driven --watch output, a complete Entry Ticket
# renderer, an end-of-window pilot report, and monitoring counters. See
# docs/VERSION_HISTORY.md for the full application-vs-strategy version separation.
#
# AG_TRADE_ASSISTANT_V1_0.yaml and AG_TRADE_ASSISTANT_V1_0_1.yaml are left byte-for-byte
# unchanged and remain independently loadable/reproducible.

release_id: AG_TRADE_ASSISTANT_V1_0_2
status: PILOT
supersedes: AG_TRADE_ASSISTANT_V1_0_1

day_trading_strategy:
  id: ST_ASIAN_SWEEP_5R_V1
  version: "1.1.1"
  authority: SOLE_DAY_TRADING_STRATEGY

universe:
  EURUSD: ENABLED
  GBPUSD: ENABLED

reference_session:
  source: config/canonical_sessions.yaml
  name: ASIAN

active_cycle:
  id: ASIAN_LONDON
  start_utc: "07:00"
  end_utc: "11:00"

# Unchanged from V1.0.1 -- reproduced here verbatim (not re-derived) purely so this
# manifest's own fingerprint reflects the full effective policy an operator is running
# under; the actual runtime numbers are read from config/pilot/
# AG_POST_ASIAN_LONDON_PILOT_V1_0_1.yaml, not from this copy.
risk:
  risk_per_trade_pct: 0.5
  max_open_positions: 2
  max_new_trades_per_day: 2
  max_new_trades_per_symbol_per_day: 1
  max_aggregate_open_risk_pct: 1.0
  strategy_loss_lock_r: -1.0

selection_policy:
  timestamp_source: qualifying_closed_m15   # ready_at, never evaluation_time
  winner_policy: earliest_ready_multi_slot
  max_slots: 2
  max_slots_per_symbol: 1
  exact_timestamp_priority: [EURUSD, GBPUSD]
  slot_consumption:
    on_selection: true
    release_on_expiry: false
    release_on_decline: false

# NEW in V1.0.2 -- operational capabilities, not strategy/risk policy.
application_capabilities:
  ready_restart_recovery: true
  immutable_asian_snapshots: true
  dedicated_preflight_cli: true
  event_driven_watch_output: true
  complete_entry_ticket: true
  end_of_window_report: true
  monitoring_counters: true
  execution_integration: NOT_WIRED

features:
  session_trade: true
  SMC_advisory: false
  order_flow_advisory: false
  Large_SMC_entries: false
  crypto: false

execution:
  proposal_generation: true
  mode: PROPOSAL_ONLY
  explicit_confirmation_required: true
  automatic_execution: false
  live_execution: false
