# SPEC ONLY — not read by any code.
#
# Ticket verification status and execution-route SPEC for docs/PROJECT_OBJECTIVE.md,
# section "Ticket lanes & execution routing (2026-10-12)". Owner rulings R2–R4 on PR #177.
# No file under config/ is part of this spec. The runtime per-scope registry and its loader
# are NOT created here; they belong to a later, separately authorized PR. Until that PR lands,
# no code reads this file and no scope has a status.
#
# Fail-closed rules (target behaviour once the runtime registry exists):
#   - a missing scope, unknown status or malformed entry => execution_route=REPORT_ONLY
#   - live accounts are never routable
#   - PASSED makes a scope eligible; a per-scope owner standing DEMO authorization makes it routable
#   - setting any scope to PASSED is a governed owner action, not an agent action
schema_version: "1"
policy_id: TICKET_VERIFICATION_ROUTING_V1
status: SPEC_ONLY

verification_status_enum: [UNVERIFIED, IN_VERIFICATION, LOGIC_VERIFIED, PASSED, STALE_IDENTITY]
execution_route_enum: [DEMO_ORDER, REPORT_ONLY]
default_verification_status: UNVERIFIED
default_execution_route: REPORT_ONLY
report_only_label_format: "REPORT-ONLY: <verification_status>"

# PASSED scope requirements (scope-level; each recorded as an evidence reference, not a boolean).
# The optional shadow soak is NOT a PASSED requirement (C14 / OD1009-D5).
passed_requirements:
  logic: L1-L6
  data: G2_symbol_info
  cost: G3_risk_cost_keys
  host_acceptance: G4

# Routing to DEMO_ORDER additionally requires a per-scope owner standing DEMO authorization (C14 gate 5).
demo_order_requires:
  - verification_status: PASSED
  - standing_demo_authorization: owner-recorded, valid, revocable, strategy-version and scope specific

# Per-ticket guards applied even when PASSED. A failing guard => REPORT_ONLY with the reason.
per_ticket_guards:
  risk_pct: 0.5
  cost_block_R: 0.25
  crypto_spread_block_fraction: 0.20   # owner instruction 2026-10-12; no config key yet (follow-up b)
  lsmc_min_remaining_reward_fraction: 0.5

# Shape of a future runtime registry entry (illustrative only; no entries exist):
#   <strategy_id>@<semantic_version>|<instrument>|<session_or_branch>:
#     verification_status: <enum>
#     standing_demo_authorization_ref: <id or null>   # null => DEMO_AUTHORIZATION_ABSENT
#     evidence_refs: [...]
