strategy_id: ST_SESSION_SWEEP_RETEST_V1
strategy_name: Session High/Low Liquidity Sweep + H1 Trend + M5 MSS + Retest
strategy_family: Liquidity_Sweep_MSS_Retest
version: 1.0.0
status: ACTIVE_INCUBATION
registered_utc: "2026-08-30"
updated_utc: "2026-08-30"

# Forex only, V1 scope.
instruments: [EURUSD, GBPUSD]
magic_number: 777002

# Canonical reference session (00:00-06:00 UTC), matching config/canonical_sessions.yaml's
# `asian` window exactly -- see strategy_engine/sweep_retest/config.py for why this
# strategy uses its own small loader rather than strategy_engine.loader.load_strategy.
asian_reference_session:
  name: Asian
  start_time_gmt: "00:00"
  end_time_gmt: "06:00"

# STRATEGY execution windows -- distinct from canonical session definitions in
# config/canonical_sessions.yaml. Not a redefinition of London/New York session boundaries,
# only when THIS strategy is allowed to look for a sweep.
execution_windows:
  - name: London_Open
    start_time_gmt: "07:00"
    end_time_gmt: "10:00"
  - name: New_York_Open
    start_time_gmt: "12:00"
    end_time_gmt: "15:00"

timeframe_responsibilities:
  h1: DIRECTIONAL_MARKET_STRUCTURE_ONLY
  m15: SESSION_REFERENCE_ONLY
  m5: SWEEP_MSS_RETEST
  m1: EXECUTION_FILL_PRECISION_ONLY

h1_trend_filter:
  source: market_structure.structural_breaks_for_candles  # existing Market Structure capability, no EMA filter
  bullish_routes_to: LOW_SWEEP_LONG_ONLY
  bearish_routes_to: HIGH_SWEEP_SHORT_ONLY
  neutral_or_indeterminate: NO_TRADE_DIRECTION

sweep_contract:
  short_candidate: "M5.high > AsianHigh AND M5.close < AsianHigh"
  long_candidate: "M5.low < AsianLow AND M5.close > AsianLow"
  candle_must_be_closed: true
  wick_ratio_filter: DISABLED  # V1: no wick-size threshold anywhere in this strategy

mss_contract:
  swing_source: market_structure.smc_adapter.full_swings  # existing Market Structure capability
  confirmation: "subsequent CLOSED M5 candle closes beyond the located swing"
  intrabar_penetration_sufficient: false

entry_rules:
  trigger: RETEST_BROKEN_SWING
  entry_ttl_m5_bars: 3
  fvg_or_order_block_alternative: false
  chase_displacement_candle: false

risk_and_money_management:
  risk_mode: FIXED_PERCENT
  risk_percent: 0.5
  sl_buffer_pips: 2.5
  # SHORT: sweep_high + sl_buffer_pips. LONG: sweep_low - sl_buffer_pips.

position_split_and_targets:
  tp1_target: ASIAN_SESSION_MIDPOINT
  tp1_volume_pct: 0.5
  tp1_action: MOVE_REMAINING_TO_BREAKEVEN
  tp2_target_short: ASIAN_LOW
  tp2_target_long: ASIAN_HIGH
  min_tp2_r_multiple: 1.5
  # If TP2 reward/risk < min_tp2_r_multiple -> NO_TRADE_TARGET_GEOMETRY. No substitute TP.

global_guards:
  max_open_strategy_positions: 1
  daily_loss_circuit_r: -2.0
  # Blocks new entries once daily realized R <= daily_loss_circuit_r; resets automatically
  # at the next UTC trading day (see execution/daily_loss_guard.py).

invalidation_rules:
  setup_expired: "no valid retest within entry_ttl_m5_bars completed M5 candles after MSS confirmation"
  session_expired: "execution window closes with no qualified sweep found"
