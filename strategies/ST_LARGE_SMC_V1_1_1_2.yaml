implementation_choices_flagged:
- SW-A fractal width k=2 is reused from the 1.1.0 contract (fx_discovery.features.SWING_K).
- H1 bias remains the direction of the latest close-confirmed H1 break; D1 break direction
  remains context only.
- OB origin search remains the last opposing candle within 3 bars before displacement;
  FLIP_OB remains unidentified.
- smartmoneyconcepts OB candidates remain unused; AG_ORDER_BLOCK_V1 is applied over
  causal fx_discovery primitives and the frozen zone classifier.
- C10 retains the current 1.1.0 formula, requires host-captured point provenance,
  and passes only an independently owner-confirmed pip_size; a missing capture returns
  C10_PIP_SIZE_NOT_EVIDENCED and a malformed or mismatched capture returns C10_PIP_SIZE_NOT_EVIDENCED.
- C11 accepts only the existing core model's PRIMARY_EXTERNAL_LIQUIDITY result; its
  legacy M5 fallback is ignored, then the nearest confirmed opposing H1 SW-A swing
  is used.
- A tie between equally near H1 fallback swings fails closed; the owner has not confirmed
  a tie-break.
- The current 1.1.0 watch does not call the core primary target model; this candidate
  spec is not runtime-wired.
- The 1.1.0 contract/spec had no RR minimum; this candidate declares minimum_rr=2.0
  as PENDING_OWNER_CONFIRM and fails closed below it.
- 1.1.2 pins the POI-age unit to distinct NY-17:00 trading dates (D-LSMC-6); the frozen
  1.1.0 engine still counts calendar boundaries and this candidate is wired only to
  the optional REPORT_ONLY engine path, stamped NOT_VERIFIED.
- Stale = no closed M5 bar for more than 15 minutes; FX market closed Friday 17:00
  through Sunday 17:00 New York.
- FX expiry uses config/canonical_sessions.yaml; BTC/ETH expiry uses the active crypto
  ticket-window config and next configured window end when outside a window.
not_specified:
- '1.1.2 specifies no holiday calendar: the trading-date count excludes weekend dates
  only, which is what watch.trading_date derives from config/canonical_sessions.yaml.
  Broker holiday calendars remain unspecified.'
- Host-captured points are available from main for all six candidate instruments (BTCUSDT/ETHUSDT
  through BTCUSD/ETHUSD aliases), but the proposed pip rules remain PENDING_OWNER_CONFIRM
  and are not applied to pip_size.
- The candidate RR minimum of 2.0 is PENDING_OWNER_CONFIRM; it is not represented
  as a confirmed 1.1.0 rule.
- The H1 fallback sweep-state filter and equal-distance tie-break have no owner-signed
  value; the candidate specifies no sweep filter and fails closed on a tie.
- Every other D-item of the unpushed RMR-A catalogue remains outside this candidate.
