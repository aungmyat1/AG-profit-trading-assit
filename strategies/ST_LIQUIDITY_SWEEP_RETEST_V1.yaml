strategy_id: ST_LIQUIDITY_SWEEP_RETEST_V1
strategy_name: Liquidity Sweep + H1 Trend + M5 MSS + Retest (Forex + Crypto)
strategy_family: Liquidity_Sweep_MSS_Retest
version: 2.0.0
status: ACTIVE_INCUBATION
registered_utc: "2026-08-30"
updated_utc: "2026-08-30"

# v2.0.0: generalized from ST_SESSION_SWEEP_RETEST_V1 (Forex-only) to an asset-independent
# sweep/MSS/retest engine parameterized by a market profile -- see
# strategy_engine/sweep_retest/profile.py. The Forex profile below is unchanged in
# substance from v1.0.0; the Crypto profile is new. Global guards (position concurrency,
# daily loss) are COMBINED across both profiles, not tracked per-profile.

magic_number: 777002  # MT5 magic number -- Forex profile only; the Crypto profile has no MT5 order

profiles:
  - profile_id: FOREX
    instruments: [EURUSD, GBPUSD]
    reference:
      kind: ASIAN_SESSION
      label: Asian
      start_time_gmt: "00:00"
      end_time_gmt: "06:00"
    # STRATEGY execution windows -- distinct from canonical session definitions in
    # config/canonical_sessions.yaml.
    execution_windows:
      - name: London_Open
        start_time_gmt: "07:00"
        end_time_gmt: "10:00"
      - name: New_York_Open
        start_time_gmt: "12:00"
        end_time_gmt: "15:00"
    stop_buffer:
      kind: PIP
      pips: 2.5

  - profile_id: CRYPTO_PERP
    instruments: [BTCUSDT, ETHUSDT]
    # Intended instrument class: USDT perpetual futures. Signal generation only in this
    # task -- no exchange integration (see execution_architecture below).
    reference:
      kind: PREVIOUS_DAY
      label: PreviousDay
      # Strict UTC midnight-to-midnight day boundary (spec) -- see
      # strategy_engine/sweep_retest/profile.py::previous_utc_day_window. No existing
      # crypto/day-boundary contract was found elsewhere in this repo.
    # A strategy activity window, NOT a market-hours claim -- crypto trades 24/7.
    execution_windows:
      - name: Strategy_Activity_Window
        start_time_gmt: "13:30"
        end_time_gmt: "16:00"
    stop_buffer:
      kind: TICK
      ticks: 10
      # Per-symbol tick size: strategy_engine/sweep_retest/crypto_symbols.py
      # (BTCUSDT 0.1, ETHUSDT 0.01) -- Forex pip math is NOT applied to crypto.

timeframe_responsibilities:
  h1: DIRECTIONAL_MARKET_STRUCTURE_ONLY
  m15: SESSION_REFERENCE_ONLY  # Forex profile only
  m5: SWEEP_MSS_RETEST
  m1: EXECUTION_FILL_PRECISION_ONLY

h1_trend_filter:
  source: market_structure.structural_breaks_for_candles  # existing Market Structure capability, no EMA filter
  bullish_routes_to: LOW_SWEEP_LONG_ONLY
  bearish_routes_to: HIGH_SWEEP_SHORT_ONLY
  neutral_or_indeterminate: NO_TRADE_DIRECTION

sweep_contract:
  short_candidate: "M5.high > RefHigh AND M5.close < RefHigh"
  long_candidate: "M5.low < RefLow AND M5.close > RefLow"
  candle_must_be_closed: true
  wick_ratio_filter: DISABLED  # V1: no wick-size threshold anywhere in this strategy

mss_contract:
  swing_source: market_structure.smc_adapter.full_swings  # existing Market Structure capability
  confirmation: "subsequent CLOSED M5 candle closes beyond the located swing"
  intrabar_penetration_sufficient: false

entry_rules:
  trigger: RETEST_BROKEN_SWING
  entry_ttl_m5_bars: 3
  fvg_or_order_block_alternative: false
  chase_displacement_candle: false

risk_and_money_management:
  risk_mode: FIXED_PERCENT
  risk_percent: 0.5
  # SHORT: sweep_high + stop_buffer. LONG: sweep_low - stop_buffer. Buffer convention
  # (pip vs tick) is per-profile, see each profile's stop_buffer block above.

position_split_and_targets:
  tp1_target: REFERENCE_MIDPOINT  # Asian mid (Forex) / Previous-Day mid (Crypto)
  tp1_volume_pct: 0.5
  tp1_action: MOVE_REMAINING_TO_BREAKEVEN
  tp2_target_short: REFERENCE_LOW  # Asian low (Forex) / Previous-Day low (Crypto)
  tp2_target_long: REFERENCE_HIGH  # Asian high (Forex) / Previous-Day high (Crypto)
  min_tp2_r_multiple: 1.5
  # If TP1 (reference midpoint) is on the wrong side of entry, OR TP2 reward/risk <
  # min_tp2_r_multiple -> NO_TRADE_TARGET_GEOMETRY. This applies identically to both
  # profiles (one shared target-plan code path, strategy_engine/sweep_retest/targets.py)
  # -- no substitute TP is ever invented, and no separate "skip TP1" partial-less exit
  # path exists for crypto; an invalid TP1 rejects the whole setup, same as Forex always
  # has. See status report for why this choice was made over a skip-TP1 fallback.

global_guards:
  scope: COMBINED_ACROSS_PROFILES  # one open position / one daily-R ledger for Forex+Crypto together
  max_open_strategy_positions: 1
  daily_loss_circuit_r: -2.0
  # Blocks new entries once daily realized R <= daily_loss_circuit_r; resets automatically
  # at the next UTC trading day (see execution/daily_loss_guard.py).

execution_architecture:
  forex: EXISTING_MT5_EXECUTION_PATH_UNCHANGED  # execution/executor.py + mt5/management_gateway.py
  crypto: EXECUTION_ADAPTER_INTERFACE_ONLY  # execution/adapter.py -- no exchange integration, proposal-only

invalidation_rules:
  setup_expired: "no valid retest within entry_ttl_m5_bars completed M5 candles after MSS confirmation"
  session_expired: "execution window closes with no qualified sweep found"
