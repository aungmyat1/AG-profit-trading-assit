# Strategy registry -- data only (2026-08-27). Lists every strategy the Trade Assistant is
# aware of, distinct from EXECUTION PERMISSION for any of them. See docs/architecture/TRADE_ASSISTANT_ARCHITECTURE.md
# for why this is a data file rather than a running orchestrator: nothing in this repo currently
# calls a strategy-manager runtime, and building one with no caller would be speculative
# infrastructure, not a real boundary. Add a manager/loader when a real caller needs one.
#
# registered   -- the assistant knows this strategy exists
# active       -- currently the strategy being run/tracked (vs. dormant/archived)
# research     -- no execution authority anywhere, analysis only
# demo_authorized / live_authorized -- set independently; never conflate registration with permission

strategies:
  ST_ASIAN_SWEEP_5R_V1:
    registered: true
    active: true
    research: true
    demo_authorized: false   # explicit-command demo execution exists project-wide, but this strategy
                             # remains independently blocked by its own open contract gaps
    live_authorized: false   #   independently by strategies/STRATEGY_LEDGER.md's own open gaps
                              #   (entry_order_type undefined, risk_per_trade_pct unspecified)
    config_source: strategies/ST_ASIAN_SWEEP_5R_V1.yaml
    engine: strategy_engine (this repo)
    # Manual Trade Ticket V1 (owner decisions 2026-10-06, docs/status/AG_MANUAL_TRADE_TICKET_V1_STATUS.md).
    # Read by src/v1_tickets/authority.py; unknown/missing values fail closed (no tickets).
    # A manual ticket is never an order: demo_order_authority NONE, demo/live flags unchanged.
    ticket_authority: MANUAL_ONLY
    logic_status: NOT_VERIFIED          # LOGIC_VERIFIED only with a matching logic_verified_identity
    logic_verified_identity: null
    economic_status: NOT_EVALUATED
    demo_order_authority: NONE
    # L2 closure candidate (2026-10-07, docs/status/AG_ST_ASIAN_SWEEP_5R_V1_1_1_2_L2_CLOSURE_2026-10-07.md).
    # Not the current authority: the runtime still loads config_source (v1.1.1, NOT_VERIFIED),
    # so no TICKET_READY can come from this block. Promotion needs the owner's Phase B confirmation.
    candidate_versions:
      "1.1.2":
        config_source: strategies/ST_ASIAN_SWEEP_5R_V1_1_1_2.yaml
        status: CANDIDATE_PENDING_OWNER_CONFIRM
        logic_status: LOGIC_VERIFIED            # Logic Gate L1-L6 on recorded fixtures; bound to the identity below
        logic_verified_identity: d7a8ebe5b176e8089905c75a6b0223eebd893c2b9324ca61865aa135d2eec7d5
        economic_status: NOT_EVALUATED
        edge_verified: false
        ticket_ready: PAUSED_PENDING_OWNER_CONFIRM

  SESSION_TRADE_V1:
    registered: true
    active: true
    research: false
    demo_authorized: false   # AG V1 owner decision D3 (2026-09-30): demo authority withdrawn;
                             # was true (ASIAN_LONDON only) -- see docs/governance/AG_V1_TWO_GOALS_OWNER_DECISIONS.md
    live_authorized: false
    config_source: strategies/session_trade/contract.yaml
    engine: "session_strategy (D:\\ddev\\Session Trade Codex -- separate repository, referenced not vendored)"
    # Manual Trade Ticket V1 (owner decisions 2026-10-06, docs/status/AG_MANUAL_TRADE_TICKET_V1_STATUS.md).
    # Read by src/v1_tickets/authority.py; unknown/missing values fail closed (no tickets).
    # Engine is not in this repo: tickets fail closed with STRATEGY_ADAPTER_NOT_IMPLEMENTED.
    # A manual ticket is never an order: demo_order_authority NONE, demo/live flags unchanged.
    ticket_authority: MANUAL_ONLY
    logic_status: NOT_VERIFIED          # LOGIC_VERIFIED only with a matching logic_verified_identity
    logic_verified_identity: null
    economic_status: NOT_EVALUATED
    demo_order_authority: NONE

  SMC_3R_V1:
    registered: true
    active: false
    research: true
    demo_authorized: false
    live_authorized: false
    config_source: "SMC_3R_V1_SPEC.md (D:\\ddev\\Session Trade Codex)"
    engine: "smc_3r_v1 (D:\\ddev\\Session Trade Codex)"
    note: independence preserved; not merged into SESSION_TRADE_V1's rules.

  ST_LARGE_SMC_V1:
    registered: true
    active: false
    research: true
    demo_authorized: false
    live_authorized: false
    config_source: strategies/ST_LARGE_SMC_V1.yaml
    engine: "src/large_smc_research/engine.py (RESEARCH_ONLY -- no proposal/demo/live/execution/risk-sizing authority; C10 stop-loss SIGNED and implemented as of v1.0.7 (c10_stop_policy.py, 2026-09-07), RESEARCH_QUALIFIED now reachable; pending-entry expiry RESOLVED_BY_REUSE as of v1.0.6, see historical_replay/fill_simulator.py). AG-EGSVF lifecycle stage (recorded only in src/validation_framework/adapters/large_smc_adapter.py -- this registry has no lifecycle_stage/version field): owner-promoted OFFLINE_RESEARCH -> FORWARD_RESEARCH 2026-09-07, see strategies/STRATEGY_LEDGER.md's AG_LARGE_SMC_V1_FORWARD_RESEARCH_PROMOTION_V1 entry. Next transition (FORWARD_RESEARCH -> OPERATIONAL_SHADOW) is evaluated, not executed, and blocks on an unresolved shadow-entry-evidence gate."
    note: >-
      Independent Large-SMC research contract. Shares advisory capabilities with other
      strategies but does not inherit ST_ASIAN_SWEEP_5R_V1, SMC_3R_V1, or
      ST_LIQUIDITY_SWEEP_RETEST_V1 authority or validation evidence.
      AG V1 Goal 2 (2026-09-30): NEW version 1.1.0 registered alongside, v1.0.7 unchanged --
      config strategies/ST_LARGE_SMC_V1_1_1_0.yaml, engine src/large_smc_watch/ (watch/alerts
      only, status SHADOW_ALERTS_ONLY, instruments EURUSD GBPUSD USDJPY XAUUSD BTCUSDT
