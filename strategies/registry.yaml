    research: true
    demo_authorized: false
    live_authorized: false
    config_source: strategies/ST_LIQUIDITY_SWEEP_RETEST_V1.yaml
    engine: "RESEARCH_ONLY -- src/strategy_engine/sweep_retest/ (signal engine, asset-independent, both FOREX and CRYPTO_PERP profiles); BTC daily research/reporting orchestration: src/btc_sweep_research/ (pipeline.py -> daily_report.py); BTC market data: src/execution_runtime/bybit_linear_perp_feed.py (Bybit V5 linear perpetual, public/read-only, owner-approved AG_V1_0_3_BYBIT_QUALIFICATION_EXCEPTION scope) and src/execution_runtime/binance_usdtm_feed.py (Binance USDT-M, environment-blocked HTTP 451, retained as an alternate implementation of the same CryptoCandleFeed interface)"
    note: >-
      Version 2.0.0, ACTIVE_INCUBATION (see strategies/STRATEGY_LEDGER.md for full
      history). RESEARCH_ONLY authority throughout -- no proposal ever reaches
      execution.executor/execution.coordinator/mt5.management_gateway (statically and
