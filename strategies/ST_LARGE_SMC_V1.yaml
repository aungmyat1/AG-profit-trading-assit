strategy_id: ST_LARGE_SMC_V1
strategy_name: Large SMC Opportunity Service
strategy_family: LARGE_SMC
version: 1.0.3
status: RESEARCH_DRAFT
registered_utc: "2026-09-01"
# v1.0.1 (2026-09-01): C11 target-model contract frozen (RESOLVED_BY_OWNER, Candidate
# 2 -- HYBRID_WITH_STRUCTURAL_FALLBACK). Per docs/VERSION_HISTORY.md, "targets" is an
# explicit strategy-version-bump trigger. Still RESEARCH_DRAFT; target_model below is
# CONTRACT_ONLY -- no engine wired, no proposal/execution authority implied.
# v1.0.2 (2026-09-01): C12 candidate-lifecycle/expiry contract frozen (RESOLVED_BY_REUSE
# -- no independent M1/M2/M3 clock exists anywhere in AG; validity is governed entirely
# by the already-implemented, shared QualifiedEEvent.is_eligible_at() E-context window).
# Per docs/VERSION_HISTORY.md, "intrinsic trade eligibility logic" is an explicit
# strategy-version-bump trigger. Still RESEARCH_DRAFT; candidate_lifecycle below is
# CONTRACT_ONLY -- no engine wired, no proposal/execution authority implied.
# v1.0.3 (2026-09-01): C14 candidate-identity/duplicate/re-entry contract frozen
# (RESOLVED_BY_REUSE -- setup_id/reference_key/lifecycle-signature machinery already
# exists in src/proposals/ and is already used by historical_replay/orchestrator.py
# for this exact E/M pipeline; nothing new was invented). Per docs/VERSION_HISTORY.md,
# "setup qualification"/"intrinsic trade eligibility logic" are explicit
# strategy-version-bump triggers. Still RESEARCH_DRAFT; candidate_identity below is
# CONTRACT_ONLY -- no engine wired, no proposal/execution authority implied.

# Independent of ST_ASIAN_SWEEP_5R_V1. Registration permits research/advisory use
# only. UNSIGNED fields make signal generation and execution fail closed.
authority:
  active: false
  research: true
  advisory_only: true
  proposal_generation_authorized: false
  demo_authorized: false
  live_authorized: false

purpose: >-
  Identify event- and location-driven Large SMC opportunities using D1/H1 primary
  context with M5 confirmation/entry (owner UC-001 decision, Model B); H4-origin
  evidence is consumed only where an existing E-model contract explicitly allows it
  (E3's caller-supplied liquidity-level origin).

asset_class: FX
instruments: UNSIGNED

# Owner UC-001 decision (2026-09-01, docs/status/ST_LARGE_SMC_V1_UC_001_TIMEFRAME_DECISION.md):
# primary architecture = D1/H1/M5, matching the frozen E1/E2/E3 + M1/M2/M3 research
# pipeline (src/entry_confirmation/). NOTE: the "M1" key below is the 1-minute
# TIMEFRAME, unrelated to the "M1" confirmation MANEUVER model (m1_character_change_
# inducement.py) -- the two share a name by coincidence, not by design.
timeframe_responsibilities:
  D1: MACRO_EVENT_REFERENCE   # E1's D1-gap reference only (entry_models_v1.REFERENCE_TIMEFRAME_E1)
  H1: STRUCTURE_LOCATION_LIQUIDITY_REACTION   # E1/E2/E3 structure, POI, liquidity, reaction check (CHECK_TIMEFRAME)
  M5: CONFIRMATION_AND_ENTRY   # M1/M2/M3 maneuver confirmation + entry array (CONFIRMATION_TIMEFRAME/EXECUTION_TIMEFRAME)
  H4: OPTIONAL_EVIDENCE_ORIGIN_ONLY   # E3 may accept an H4-origin LiquidityLevel; not a primary/mandatory layer
  M15: NOT_REQUIRED   # no Large-SMC or existing E/M-pipeline semantics use M15
  M1: UNSIGNED   # 1-minute timeframe; no evidence assigns it a role

location_model:
  external_liquidity: CANDIDATE_INPUT
  internal_liquidity: CANDIDATE_INPUT
  premium_discount: CANDIDATE_INPUT
  order_block: CANDIDATE_INPUT
  fair_value_gap: CANDIDATE_INPUT
  supply_demand: CANDIDATE_INPUT
  protected_highs_lows: CANDIDATE_INPUT
  qualification_rule: UNSIGNED

confirmation_sequence:
  liquidity_event: REQUIRED_CANDIDATE
  market_structure_shift_or_choch: REQUIRED_CANDIDATE
  displacement: REQUIRED_CANDIDATE
  entry_array: UNSIGNED
  exact_sequence_and_timing: UNSIGNED

decision_states: [READY, WATCH, NO_TRADE, DATA_ERROR, EXPIRED, BLOCKED]

entry:
  timeframe: UNSIGNED
  trigger: UNSIGNED
  order_type: UNSIGNED
  expiry: SEE_CANDIDATE_LIFECYCLE   # see candidate_lifecycle below (C12, UC-011)

# C11 (UC-010): RESOLVED_BY_OWNER (Candidate 2, HYBRID_WITH_STRUCTURAL_FALLBACK,
# 2026-09-01). CONTRACT_ONLY -- no engine wired, no adapter implemented; every field
# below reuses an already-existing, already-frozen AG mechanism (cited), not a new
# detector. See docs/specs/LARGE_SMC_V1_SPEC.md sec.16 and
# docs/status/ST_LARGE_SMC_V1_C11_TARGET_MODEL_RESOLUTION_STATUS.md and
# ..._C11_CONTRACT_FINALIZATION_STATUS.md for full derivation and provenance.
target_model:
  status: CONTRACT_ONLY
  authority: RESOLVED_BY_OWNER
  type: HYBRID_WITH_STRUCTURAL_FALLBACK
  implementation: NOT_IMPLEMENTED
  scope: GLOBAL   # applies identically across all 9 E1-E3 x M1-M3 research variants

  anchor_price:
    source: SELECTED_M_MODEL_CANDIDATE_ENTRY_PRICE   # SMCEntryCombinationResult.entry_price
    decision_timestamp: M_MODEL_ENTRY_ARRAY_AVAILABILITY_TIMESTAMP   # no lookahead: reuses the
      # same timestamp the M-model's own entry_price/READY transition already uses

  primary:
    type: OPPOSING_EXTERNAL_UNSWEPT_LIQUIDITY
    timeframe: M5   # matches historical_replay/stage2.py's own external_swing_liquidity(symbol,"M5",...) wiring
    candidate_universe: MARKET_STRUCTURE_EXTERNAL_TIER_LATEST_SWING   # StructureTier.latest_swing_high/low via liquidity.hierarchy.external_swing_liquidity() -- structurally at most one candidate per side, no lookback parameter to invent
    required_status: UNSWEPT   # liquidity.status.compute_status
    direction_long: nearest qualifying BUY_SIDE EXTERNAL/UNSWEPT liquidity strictly above anchor_price
    direction_short: nearest qualifying SELL_SIDE EXTERNAL/UNSWEPT liquidity strictly below anchor_price
    selection: NEAREST_IN_TRADE_DIRECTION   # distance = abs(target_price - anchor_price)
    tie_break: NOT_APPLICABLE   # candidate universe is structurally single-valued per side (latest_swing_high/low)

  fallback:
    type: CONFIRMED_M5_SWING_EXTREMUM
    timeframe: M5
    swing_contract: market_structure.tiers.StructureTier (EXTERNAL tier, swing_length=50) -- reused verbatim, no new swing algorithm
    candidate_universe: StructureTier.swings (ALL confirmed EXTERNAL-tier M5 swings, chronological) filtered to UNSWEPT + correct side, excluding whichever swing the primary tier already evaluated
    required_status: UNSWEPT
    confirmation_rule: reuses market_structure's existing confirmed-swing point-in-time guarantee -- eligible only if already confirmed as of decision_timestamp
    direction_long: nearest qualifying confirmed UNSWEPT M5 swing high above anchor_price
    direction_short: nearest qualifying confirmed UNSWEPT M5 swing low below anchor_price
    selection: NEAREST_IN_TRADE_DIRECTION
    tie_break: MOST_RECENT_ORIGIN_TIME_WINS   # reuses market_structure/tiers.py::_build_tier's own "reversed(...) + next(...) = most recent match wins" reduction convention

  priority:
    tier_1: OPPOSING_EXTERNAL_UNSWEPT_LIQUIDITY   # if any valid candidate exists, tier 1 wins outright -- no cross-tier comparison
    tier_2: CONFIRMED_M5_SWING_EXTREMUM

  no_target:
    state: NO_TRADE
    reason_code: REJECT_NO_TARGET
    ready_with_null_target: PROHIBITED

  mode: STATIC   # selected once at candidate qualification; no dynamic retargeting, no trailing target

  provenance_fields_required: [target_price, target_tier, target_type, target_source,
    target_source_id, target_side, target_status_at_selection, target_selected_at,
    target_anchor_price, target_anchor_source, target_evidence_timestamp]   # future
    # output-model fields only -- not implemented in this contract-only phase

  excluded_from_scope: [SETUP_INVALIDATION, BROKER_STOP_LOSS, FIXED_R_TARGET,
    TP1, TP2, PARTIAL_PROFIT, RUNNER, BREAKEVEN, TRAILING]   # C10/C14/trade-management
    # remain separately tracked; not defined or implied by this contract

# C12 (UC-011): RESOLVED_BY_REUSE (2026-09-01). CONTRACT_ONLY -- no engine wired.
# Governs PRE-ACTIVATION candidate validity only (never post-fill stop/TP/partial/
# runner/breakeven -- those stay out of scope, same as target_model above). Central
# finding: AG has no persistent research-candidate ledger -- historical_replay/
# stage2.py::evaluate_entry_stage() re-derives everything fresh per evaluation_time
# call (fresh get_tick/_m5_side_primitives each time), so no independent M1/M2/M3
# bar-count timer exists or was ever implemented (verified: zero EXPIRED/expiry/
# max_bars/timeout/window hits in m1/m2/m3_*.py, entry_array.py, engine_v2_1.py,
# stage2.py). The only real, already-coded validity clock is
# historical_replay/stage1.py::QualifiedEEvent.is_eligible_at() -- SHARED across all
# three M-models identically, not M-specific.
candidate_lifecycle:
  status: CONTRACT_ONLY
  authority: RESOLVED_BY_REUSE
  implementation: NOT_IMPLEMENTED

  expiry_dependency: SHARED_EXPIRY_DEPENDENCY   # not E_CONTEXT_LIFETIME_ONLY, not
    # independent M_CANDIDATE_EXPIRY -- M1/M2/M3 have no clock of their own; all three
    # defer entirely to the shared E-context eligibility mechanism below

  clock_source: QualifiedEEvent.is_eligible_at(t)   # historical_replay/stage1.py:51-57
  boundary_semantics: HALF_OPEN_START_INCLUSIVE_END_EXCLUSIVE   # "start <= t < end",
    # already coded verbatim -- not an invented convention
  same_bar_precedence: EXPIRY_FIRST   # forced by the half-open boundary itself: at
    # t == end, is_eligible_at(end) is already False, so a combination cannot newly
    # qualify on the exact boundary bar -- deterministic by construction, no owner
    # decision needed
  m1_expiry: SHARED_VIA_E_ELIGIBILITY   # no independent M1 clock exists in code
  m2_expiry: SHARED_VIA_E_ELIGIBILITY   # no independent M2 clock exists in code
  m3_expiry: SHARED_VIA_E_ELIGIBILITY   # no independent M3 clock exists in code
  non_monotonic: true   # eligibility_intervals may go FALSE->TRUE->FALSE->TRUE
    # (stage1.py:11) -- an M-combination may become newly evaluable again in a later
    # interval; this is E's own already-frozen semantics, not a C12 invention

  terminal_state: EXPIRED
  actionable_after_expiry: false
  revival_of_same_combination_instance: PROHIBITED   # architecture-audit-phase
    # invariant ("...must eventually prevent...resurrecting invalidated candidates"),
    # cited not reinvented; a later eligible interval is a new evaluation, not a
    # revived one, per non_monotonic above

  structural_invalidation:
    reuse: EXACT_REUSE
    source: >-
      entry_confirmation/invalidation.py's ManeuverInvalidation (price, source_type,
      reason, trigger, triggered) -- already wired for M1/M2 via entry_array.py and
      for M2's own zone-invalidation path; M3's IFVG-specific invalidation remains
      repo-wide PARTIAL (inverted_gap_policy), not EXACT
    distinct_from_expiry: true   # time/interval boundary -> EXPIRED; structural
      # break (OB/zone/inducement-level breach) -> INVALIDATED; not collapsed together

  target_consumed_before_activation:
    primary_tier: INVALIDATED   # not EXPIRED (this is a structural/liquidity-status
      # change, not a time/interval boundary) and not silent retargeting (C11's
      # TARGET_MODE=STATIC is preserved, unmodified)
    fallback_tier: INVALIDATED   # same reasoning once the fallback became the
      # selected static target
    reselection: PROHIBITED   # no C11 conflict -- this is a downstream consequence
      # of C11's own STATIC declaration, not a change to it
    reuse: THIN_CONTRACT_ADAPTER   # composes liquidity.status.compute_status (already
      # used once at target selection) re-invoked at a later evaluation_time -- no new
      # detector, but not yet actually wired anywhere either

  data_quality_failure: INSUFFICIENT_DATA   # existing EntryModelState value; never
    # fabricate EXPIRED from incomplete/unprovable chronology

  no_lookahead: expiry_evidence_timestamp <= decision_timestamp, reusing the same
    # closed-bar/no-future-candle guarantee already verified project-wide; is_eligible_at
    # itself takes no future information -- eligibility_intervals are reconstructed from
    # already-closed evidence only

  restart_replay_determinism: EXACT_REUSE   # same (event, evaluation_time) always
    # yields the same is_eligible_at() result; previously proven byte-identical across
    # repeated runs (TRUE_STAGE2_ORACLE_RECONCILIATION_STATUS.md's determinism check)

# C14 (UC-013): RESOLVED_BY_REUSE (2026-09-01). CONTRACT_ONLY -- no engine wired,
# composer.py untouched. Central finding: src/proposals/identity.py's setup_id()/
# reference_key_for() and src/proposals/lifecycle.py's CREATED/STILL_VALID/UPDATED/
# INVALIDATED/EXPIRED state machine already exist as generic (not Session-specific)
# infrastructure, and are already used by historical_replay/orchestrator.py's
# SetupLedger for this exact E1-E3/M1-M3 pipeline -- confirmed by inspecting the
# golden setup_ids themselves (SETUP-EURUSD-E1M3-..., SETUP-EURUSD-E3M3-...), not by
# rerunning replay. Nothing here was newly invented.
candidate_identity:
  status: CONTRACT_ONLY
  authority: RESOLVED_BY_REUSE
  implementation: NOT_IMPLEMENTED

  exact_duplicate_key: >-
    setup_id(symbol, combination, direction, reference_key) -- proposals/identity.py,
    a pure blake2b hash with no transient fields (current tick, poll time, snapshot
    id) as input; same underlying setup keeps the same identity across every poll.
    reference_key pins the E-condition's own structural reference (reference_type +
    reference_low/high/level), NOT the M-model's entry-array geometry and NOT the
    eligibility interval's start/end bounds.
  reuse: EXACT_REUSE
  wall_clock_component: NONE
  restart_stability: EXACT_REUSE   # same evidence + same (symbol,combination,direction,
    # reference_key) always yields the same setup_id, no process/UUID/poll-order input

  identity_layers:
    E_event_identity: QualifiedEEvent.event_id (historical_replay/stage1.py _make_event_id;
      blake2b of symbol+entry_condition+direction+reference_key) -- EXACT_REUSE
    M_model_identity: SMCEntryCombinationResult.maneuver ("M1"/"M2"/"M3") -- EXACT_REUSE
    combination_identity: SMCEntryCombinationResult.combination ("E1M1".."E3M3"),
      part of the setup_id hash input -- EXACT_REUSE
    target_identity_role: ATTRIBUTE_ONLY   # target_price/target_source are NOT part of
      # setup_id's hash input -- confirmed from the formula itself, not inferred;
      # different target never implies different candidate (preserves C11's
      # entry_price-based anchor as a separate, non-identity field)
    strategy_candidate_identity: setup_id (see exact_duplicate_key above)

  coexistence:
    same_E_same_M_same_interval: SAME_CANDIDATE_UPDATED   # lifecycle transitions
      # (CREATED/STILL_VALID/UPDATED) on the same proposal_id/setup_id -- never a new
      # one -- proposals/lifecycle.py's own documented design, EXACT_REUSE
    same_E_different_M: DISTINCT_CANDIDATE   # combination differs -> different hash
      # input -> different setup_id, guaranteed by construction (e.g. E1M2 vs E1M3)
    different_E_same_M: DISTINCT_CANDIDATE   # combination AND reference_key differ ->
      # different setup_id, guaranteed by construction; verified against the golden
      # SETUP-EURUSD-E1M3-29ef3d6e78d5f9c2 vs SETUP-EURUSD-E3M3-27d758322ae69d05 pair
      # (same symbol/direction/timestamp, different setup_id) without rerunning replay
    different_E_different_M: DISTINCT_CANDIDATE   # both dimensions differ
    same_entry_same_target: DISTINCT_UNLESS_SAME_SETUP_ID   # entry_price/target are
      # not identity-bearing (see target_identity_role) -- numeric coincidence across
      # two different setup_ids never implies duplication
    same_entry_different_target: DISTINCT_UNLESS_SAME_SETUP_ID   # same reasoning
    different_entry_same_target: DISTINCT_UNLESS_SAME_SETUP_ID   # same reasoning
    multi_candidate_output: CONFIRMED   # composer.py's own docstring: "every valid
      # combination is returned; multiple E's and multiple M's may all be
      # simultaneously active... producing anywhere from 0 to 9 combinations" -- this
      # is deliberate strategy-level architecture, not an unresolved defect

  selection:
    selected_combination_field: OPTIONAL_PORTFOLIO_HANDOFF   # not
      # UNIMPLEMENTED_STRATEGY_SELECTION/LEGACY_PLACEHOLDER -- composer.py's own
      # docstring explicitly states "no priority or routing invented HERE" (spec
      # section 22), implying routing is a downstream authority's job, not a gap in
      # this layer
    strategy_level_single_winner_required: NO
    multiple_distinct_candidates_allowed: YES
    portfolio_selection_boundary: DOWNSTREAM_FUTURE_AUTHORITY   # C14 does not decide
      # which coexisting candidate receives capital -- unchanged from before this
      # phase; no portfolio policy invented

  terminality:
    expired_candidate: TERMINAL   # matches proposals/lifecycle.py's own explicit
      # _TERMINAL = (LIFECYCLE_INVALIDATED, LIFECYCLE_EXPIRED) constant -- code
      # evidence, not inference
    invalidated_candidate: TERMINAL   # same _TERMINAL constant
    revival_of_same_occurrence: PROHIBITED   # an occurrence = (setup_id, containing
      # eligibility_interval); a later, different eligibility_interval under the SAME
      # setup_id is a new occurrence under a stable structural identity, not a revived
      # one -- both halves of this statement are evidence-based (setup_id excludes
      # interval bounds from its hash; C12 already established interval-boundary
      # semantics), not a new invention

  pre_fill_requalification:
    after_expiry_new_interval: NEW_OCCURRENCE_SAME_SETUP_ID   # non-monotonic
      # eligibility (stage1.py: FALSE->TRUE->FALSE->TRUE) under the same reference_key
    after_invalidation_new_E_event: NEW_OCCURRENCE_NEW_SETUP_ID   # a genuinely new
      # E reference (different reference_key) is definitionally a new setup_id
    daily_or_session_reset: NOT_APPLICABLE   # no session/day boundary participates in
      # identity; C15 is not reopened, no limit invented

  post_fill_reentry:
    status: DEFERRED
    reason: no execution or position-lifecycle authority exists for ST_LARGE_SMC_V1
      # (status=RESEARCH_DRAFT, engine=NOT_IMPLEMENTED); this question belongs to a
      # future execution/portfolio contract, not C14

  suppression_point: >-
    conceptually belongs after composer.compose() output, computing setup_id per
    SMCEntryCombinationResult and comparing against prior occurrences -- NOT inside
    composer.py itself (unmodified this phase) and NOT inside any single M-model

  c18_interaction: >-
    opposite-direction candidates on the same symbol/interval are DISTINCT identities
    (direction is part of the setup_id hash) by construction; whether/how such
    simultaneously-valid opposite-direction candidates should be reconciled remains
    C18's open question, not resolved here

