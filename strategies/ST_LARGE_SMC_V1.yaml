stop_loss_contract:
  governance:
    contract_id: C10_STRUCTURAL_INVALIDATION_V1
    status: SIGNED_AND_LOCKED
    model_family: AG_NATIVE_INVALIDATION
    signed_utc: "2026-09-07"
    implementation: src/large_smc_research/c10_stop_policy.py
  anchor_mapping:
    model: M_MODEL_EXACT_REUSE  # SMCEntryCombinationResult.invalidation_price, never recomputed
    missing_anchor_action: FAIL_CLOSED
  buffer_policy:
    model: DYNAMIC_ATR_WITH_HARD_FLOOR
    atr_timeframe: M5
    atr_period: 14
    atr_multiplier: 0.35
    min_buffer_pips: 1.5
    atr_not_ready_action: FAIL_CLOSED  # never silently degrades to the floor alone
  spread_handling:
    mode: SIDE_AWARE
    long_policy: STRUCTURAL_ANCHOR_MINUS_BUFFER  # no spread term -- see c10_stop_policy.py docstring
    short_policy: STRUCTURAL_ANCHOR_PLUS_BUFFER_PLUS_VERIFIED_SPREAD
    missing_required_spread_action: FAIL_CLOSED  # SHORT only; LONG never requires spread
  broker_constraints:
    min_stop_violation_action: REJECT  # never WIDEN
#
