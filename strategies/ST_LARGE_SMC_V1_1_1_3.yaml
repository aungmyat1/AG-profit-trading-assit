rules:
  swings:
    model: SW-A_STRICT_FRACTAL
    causal: true
    source: fx_discovery.features.swings
    k: 2
    smartmoneyconcepts_signal_authority: false
  poi:
    models:
    - AG_ORDER_BLOCK_V1
    - FVG
    timeframe: H1
    max_age_trading_days: 5
    max_age_unit: DISTINCT_NY1700_TRADING_DATES
    max_age_unit_status: OWNER_CONFIRMED_C21_R2
    expiry_instant: START_OF_THE_TRADING_DATE_AFTER_THE_LAST_VALID_TRADING_DATE
    expiry_session_basis: config/canonical_sessions.yaml new-york 17:00 local (watch.trading_date)
    weekend_and_holiday_dates_excluded: true
    implementation_requirement: Use _poi_age_days over observed closed H1 NY-17 trading
      dates; expire when age exceeds max_age_trading_days. Preserve seven-day crypto
      expiry.
  sweep:
    model: A
    source: fx_discovery.features.sweeps
    definition: wick_beyond_known_swing_and_close_back_inside
  break:
    confirmation: CLOSE
    tie_tolerance_points: 5
    mss: CHOCH
  displacement: AG_ENTRY_DISPLACEMENT_V1
  sweep_to_choch_window_m5_bars: 12
  near_poi_band:
    atr_timeframe: H1
    atr_period: 14
    multiplier: 0.5
  entry:
    mode: BY_REFERENCE
    price: CHOCH_BAR_CLOSE
    order: NEVER_CREATED_BY_THIS_CONTRACT
  stop:
    id: C10
    status: CANDIDATE_RULE_RETAINED_WITH_CONFIGURED_UNITS
    implementation_reference: large_smc_core.c10_stop_policy.compute_c10_stop
    structural_anchor: opportunity.sweep_extreme
    pip_size:
      runtime_value_source: 10 * fields.point
      point_evidence_path: config/symbol_metadata/host_captured/<SYMBOL>.json
      schema: AG_HOST_SYMBOL_METADATA_V2
      server: VTMarkets-Demo
      symbol_map: config/broker_symbol_map/vt_markets_demo.yaml
      on_missing_or_invalid: C10_PIP_SIZE_NOT_EVIDENCED
      pip_source: 10*point host_captured <captured_at_utc>
      owner_confirmation: OD1014-FAST D2 amended 2026-10-14
    point_size:
      use_in_c10_formula: true
      conversion: 10 * fields.point
      owner_confirmation: OD1014-FAST D2 amended 2026-10-14
    buffer:
      formula: max(1.5 * pip_size, 0.35 * ATR14_M5)
      atr_timeframe: M5
      atr_period: 14
      atr_method: WILDER
      candles: CLOSED_ONLY
      cutoff: CHOCH_CANDLE_INCLUSIVE
      atr_required: true
      insufficient_atr_result: ATR_NOT_READY
      floor_only_fallback: PROHIBITED
    direction:
      LONG: structural_anchor_minus_buffer
      SHORT: structural_anchor_plus_buffer_plus_live_spread
      LONG_spread_addition: false
    spread:
      SHORT_requires_live_bid_and_ask: true
      SHORT_missing_bid_or_ask_result: MISSING_SPREAD
      ask_less_than_bid_result: INVALID_SPREAD
    broker_minimum_stop:
      if_verified_distance_is_supplied: REJECT_IF_COMPUTED_STOP_TOO_CLOSE
      if_no_broker_distance_is_supplied: NOT_APPLICABLE
      widen_stop: false
    other_fail_closed_conditions:
      missing_structural_anchor: MISSING_STRUCTURAL_ANCHOR
      invalid_direction: INVALID_DIRECTION
      invalid_atr: INVALID_ATR
      min_stop_distance_without_entry: MISSING_ENTRY_FOR_MIN_STOP_CHECK
  targets:
    id: C11
    selection_mode: STATIC_AT_OPPORTUNITY_EVALUATION
    anchor: opportunity.entry_reference
    primary:
      source: large_smc_core.target_model.select_target
      accepted_result_tier: PRIMARY_EXTERNAL_LIQUIDITY
      underlying_source: liquidity.hierarchy.external_swing_liquidity
      timeframe: M5
      structure_tier: EXTERNAL
      eligibility:
        status: UNSWEPT
        direction:
          LONG: BUY_SIDE_STRICTLY_ABOVE_ANCHOR
          SHORT: SELL_SIDE_STRICTLY_BELOW_ANCHOR
      selection: accept_the_engine_primary_tier_result_if_present
      external_tier_missing: PRIMARY_UNAVAILABLE
      legacy_fallback_m5_swing_result: IGNORE_AND_CONTINUE_TO_H1_FALLBACK
    fallback:
      condition: no_eligible_primary_external_liquidity_at_opportunity_creation
      timeframe: H1
      source: fx_discovery.features.swings
      model: SW-A_STRICT_FRACTAL
      k: 2
      candles: CLOSED_ONLY
      confirmation: swing.known_at_must_not_exceed_decision_bar_index
      eligibility:
        direction:
          LONG: confirmed_swing_high_strictly_above_anchor
          SHORT: confirmed_swing_low_strictly_below_anchor
        sweep_state_filter: NONE_SPECIFIED
      nearest_rule: minimum_absolute_price_distance_from_anchor
      equal_distance_tie: FAIL_CLOSED_AMBIGUOUS_TARGET
      no_eligible_swing: FAIL_CLOSED_TARGET_UNAVAILABLE
    no_lookahead: true
    recording:
      ticket_field: c11_source
      required_for_every_opportunity_ticket: true
      primary_value: PRIMARY_EXTERNAL_LIQUIDITY
      fallback_value: CONFIRMED_OPPOSING_H1_SWING
      no_ticket_value: NO_TICKET
    retarget_after_selection: false
    synthetic_fixed_r_target: PROHIBITED
    creation_window:
      end: OPPORTUNITY_M5_CHOCH_BAR_CLOSE
      window_start: ANCHORED_TO_CREATION_NOT_CURRENT_SCAN
      lookback_closed_bars:
        M5: 300
        H1: 200
      minimum_closed_bars:
        M5: 30
        H1: 5
      input: SEPARATE_TARGET_HISTORY_WITH_DECLARED_CAPTURE_START_UTC
      short_capture_start: ALLOW_ONLY_IF_INPUT_START_EQUALS_DECLARED_CAPTURE_START
      missing_or_truncated_creation_history: FAIL_CLOSED_C11_CREATION_HISTORY_NOT_EVIDENCED
      later_bars: IGNORED
      stateless: true
  reward_risk:
    formula: abs(target_price - entry_price) / abs(entry_price - stop_price)
    minimum_rr_source: rules.reward_risk.minimum_rr
    minimum_rr: 2.0
    minimum_rr_status: CONFIRMED
    owner_confirmation: OD1014-FAST D6, 2026-10-14
    minimum_rr_provenance: Owner confirmed OD1014-FAST D6, 2026-10-14
    acceptance: computed_rr_must_be_greater_than_or_equal_to_minimum_rr
    below_minimum: FAIL_CLOSED_RR_BELOW_SPEC_MINIMUM
    missing_minimum: FAIL_CLOSED_RR_MINIMUM_UNCONFIRMED
    missing_target_or_stop_or_zero_risk: FAIL_CLOSED_RR_UNDEFINED
    threshold_value_inferred: false
  day_boundary:
    time: '17:00'
    timezone: America/New_York
    dst: IANA
  opportunity_expiry: SESSION_END
  expiry_rules:
    FX: config/canonical_sessions.yaml
    crypto: active_crypto_ticket_window_end
    crypto_outside_window: next_configured_window_end
  stale: SUSPEND_THEN_EXPIRE
  stale_after_minutes: 15
  FX_market_closed: Friday_17_00_to_Sunday_17_00_America_New_York
  POI_age:
    unit: distinct_NY_17_00_trading_dates
    maximum: 5
alerts:
