name: Owner controlled single PR merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number listed in config/governance/pr_merge_allowlist.json
        required: true
        type: number
      expected_head_sha:
        description: Exact reviewed PR head SHA
        required: true
        type: string
      confirmation:
        description: Enter MERGE-ONE-PR
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

concurrency:
  group: single-pr-merge-main
  cancel-in-progress: false

jobs:
  merge:
    if: github.actor == 'aungmyat1' && github.ref == 'refs/heads/main' && inputs.confirmation == 'MERGE-ONE-PR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify allowlist and audited readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          allow = json.load(open('config/governance/pr_merge_allowlist.json', encoding='utf-8'))
          entries = allow.get('allowed_prs', [])
          number = int(os.environ['PR_NUMBER'])
          sha = os.environ['EXPECTED_HEAD_SHA']
          if not any(x.get('number') == number and x.get('head_sha') == sha for x in entries):
              sys.exit('PR and expected head SHA are not explicitly allowlisted')
          subprocess.run([sys.executable, 'scripts/governance/audit_pr_readiness.py', '--json', os.path.join(os.environ['RUNNER_TEMP'], 'audit.json'), '--markdown', os.path.join(os.environ['RUNNER_TEMP'], 'audit.md')], check=True)
          report = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'audit.json'), encoding='utf-8'))
          pr = next((x for x in report['pull_requests'] if x['number'] == number), None)
          if not pr or pr['classification'] != 'MERGE_NOW' or pr['head_sha'] != sha or pr['base_ref'] != 'main':
              sys.exit('Current audited evidence does not authorize this single PR operation')
          current_main = subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/git/ref/heads/main", '--jq', '.object.sha'], text=True).strip()
          if report['main_sha'] != report['main_sha_after'] or report['main_sha'] != current_main:
              sys.exit('Main changed during readiness audit; rerun after reevaluating dependencies')
          subprocess.run(['gh', 'pr', 'merge', str(number), '--squash', '--match-head-commit', sha], check=True)
          PY
        shell: bash
      - name: Verify main CI after merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          merge_sha=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
          test -n "$merge_sha"
          gh run list --branch main --commit "$merge_sha" --json databaseId,conclusion,status --jq 'if length == 0 or any(.[]; .status != "completed" or .conclusion != "success") then error("main CI missing or failed") else . end'
