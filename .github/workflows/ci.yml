name: CI

# Dispatched runs carry the merge gate's correlation id so it can bind exactly one run.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI dispatch {0}', inputs.correlation_id) || github.event.pull_request.title || github.event.head_commit.message }}

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Dispatched by manual-pr-merge.yml: its GITHUB_TOKEN merge emits no push-triggered runs.
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Merge-gate correlation id echoed in run-name
        required: true
        type: string

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check documentation links
        run: python scripts/check_docs_links.py

      - name: Check skill mirror drift
        run: python scripts/check_skill_mirror_drift.py

      - name: Check Python lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$GIT_REF" != "refs/heads/main" ] \
            && git show-ref --verify --quiet refs/remotes/origin/main; then
            base="$(git merge-base origin/main HEAD)"
          elif [ -n "$PUSH_BEFORE" ] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}"; then
            echo "Unable to identify the lint diff base" >&2
            exit 1
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$base...HEAD" -- 'src/**/*.py' 'tests/**/*.py')
          if ((${#files[@]})); then
            ruff check "${files[@]}"
          else
            echo "No changed Python files to lint."
          fi

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run lint

      - name: Run Node tests
        run: node --test web/tests/*.test.mjs

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # pull_request merge commit and its base parent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation tooling
        run: python -m pip install cogapp PyYAML pytest==8.3.5

      - name: Collect deterministic documentation facts
        run: |
          git rev-parse HEAD
          python scripts/docs/collect_facts.py
          python scripts/generate_live_status.py
          cog -r PROJECT_STATUS.md
          python scripts/docs/build_context_pack.py
          python scripts/docs/generated_files.py

      # Source PRs may leave outputs for the post-merge regeneration PR; regeneration PRs and
      # merge-gate dispatches (main CI) must match the generators exactly.
      - name: Generated-file policy gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$EVENT_NAME" in
            pull_request) python scripts/docs/check_generated_files.py --mode pr --head-ref "$HEAD_REF" ;;
            workflow_dispatch) python scripts/docs/check_generated_files.py --mode strict ;;
            *) python scripts/docs/check_generated_files.py --mode advisory ;;
          esac

      - name: Check authority claims against registry
        run: python scripts/docs/check_drift.py

      - name: Check prose claims (advisory)
        run: python scripts/docs/check_prose_drift.py

      - name: Run documentation fixture tests
        run: pytest -q tests/test_docs_live.py tests/test_context_pack.py tests/test_generated_files_ci.py

      - name: Check links (warn only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress README.md PROJECT_STATUS.md docs
          fail: false
