name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run lint

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation tooling
        run: python -m pip install cogapp PyYAML

      - name: Collect deterministic documentation facts
        env:
          FACTS_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/docs/collect_facts.py --head-ref "$FACTS_REF"

      - name: Check generated status blocks
        run: cog --check PROJECT_STATUS.md

      - name: Check authority claims against registry
        run: python scripts/docs/check_drift.py

      - name: Check links (warn only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress README.md PROJECT_STATUS.md docs
          fail: false
