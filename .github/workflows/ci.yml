name: CI

# Dispatched runs carry the merge gate's correlation id so it can bind exactly one run.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI dispatch {0}', inputs.correlation_id) || github.event.pull_request.title || github.event.head_commit.message }}

on:
  push:
  pull_request:
  # Dispatched by manual-pr-merge.yml: its GITHUB_TOKEN merge emits no push-triggered runs.
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Merge-gate correlation id echoed in run-name
        required: true
        type: string

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run lint

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation tooling
        run: python -m pip install cogapp PyYAML pytest==8.3.5

      - name: Collect deterministic documentation facts
        run: |
          git rev-parse HEAD
          python scripts/generate_live_status.py --check
          python scripts/docs/collect_facts.py
          git diff --exit-code -- status/facts.json

      - name: Check generated status blocks
        run: cog --check PROJECT_STATUS.md

      - name: Check authority claims against registry
        run: python scripts/docs/check_drift.py

      - name: Check prose claims (advisory)
        run: python scripts/docs/check_prose_drift.py

      - name: Run documentation fixture tests
        run: pytest -q tests/test_docs_live.py

      - name: Check links (warn only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress README.md PROJECT_STATUS.md docs
          fail: false
