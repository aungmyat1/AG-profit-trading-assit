name: docs-hygiene

# DOCS-LIVE-2: documentation hygiene report. Warn-only: never blocks a merge.
on:
  push:
  pull_request:

jobs:
  stale-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Front-matter coverage (warn)
        run: python scripts/docs/apply_frontmatter.py --check || echo "::warning::docs missing front-matter"
      - name: Stale / unclassified / duplicate-topic docs (warn)
        run: python scripts/docs/stale_check.py
      - name: Context pack freshness (warn)
        run: python scripts/docs/build_context_pack.py --check || echo "::warning::docs/agents/CONTEXT_PACK.md is stale; run scripts/docs/build_context_pack.py"
