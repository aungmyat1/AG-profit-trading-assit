name: regenerate-generated-files

# Identity the merge gate binds to (scripts/governance/regen_contract.run_name).
run-name: regenerate at ${{ inputs.target_sha || github.sha }} [${{ inputs.correlation_id || format('push-{0}', github.run_id) }}]

# Policy AG_REGEN_OUTCOME_V1: generated files reach main only through the bot PR from
# regen/generated-files. This workflow never pushes main. Outputs are a pure function of
# non-generated inputs, so regenerating after a regeneration PR merges is REGEN_NO_CHANGE.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit to regenerate from
        required: true
        type: string
      correlation_id:
        description: Merge-gate correlation id echoed in run-name and the outcome
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: regenerate-generated-files
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      CORRELATION_ID: ${{ inputs.correlation_id || format('push-{0}', github.run_id) }}
    steps:
      - name: Check out target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install cogapp PyYAML==6.0.3

      - name: Regenerate the four generated files
        run: |
          python scripts/docs/collect_facts.py
          python scripts/generate_live_status.py
          cog -r PROJECT_STATUS.md
          python scripts/docs/build_context_pack.py
          python scripts/docs/generated_files.py

      - name: Check regenerated outputs are self-consistent
        run: |
          python scripts/docs/collect_facts.py --check
          python scripts/generate_live_status.py --check
          cog --check PROJECT_STATUS.md
          python scripts/docs/build_context_pack.py --check

      - name: Publish through the regeneration PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/governance/regen_publish.py --repo "$GITHUB_REPOSITORY" --target-sha "$TARGET_SHA" --correlation-id "$CORRELATION_ID" --out "$RUNNER_TEMP/regen-outcome.json"

      - name: Record failure outcome when publishing did not run
        if: failure()
        run: |
          test -f "$RUNNER_TEMP/regen-outcome.json" || python scripts/governance/regen_contract.py emit --out "$RUNNER_TEMP/regen-outcome.json" --status REGEN_FAILED --target-sha "$TARGET_SHA" --correlation-id "$CORRELATION_ID" --reason "step failed before publish"

      - name: Upload regen-outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regen-outcome
          path: ${{ runner.temp }}/regen-outcome.json
          if-no-files-found: error
