name: regenerate-generated-files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install cogapp PyYAML

      - name: Regenerate the four generated files
        run: |
          python scripts/docs/collect_facts.py
          python scripts/generate_live_status.py
          cog -r PROJECT_STATUS.md
          python scripts/docs/build_context_pack.py
          python scripts/docs/generated_files.py

      - name: Enforce generated-file checks on main
        run: |
          python scripts/docs/collect_facts.py --check
          python scripts/generate_live_status.py --check
          cog --check PROJECT_STATUS.md
          python scripts/docs/build_context_pack.py --check

      - name: Commit generated files when changed
        shell: bash
        run: |
          git add -- PROJECT_STATUS.md docs/status/PROJECT_LIVE_STATUS.md status/facts.json docs/agents/CONTEXT_PACK.md
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          changed="$(git diff --cached --name-only | sort)"
          while IFS= read -r path; do
            case "$path" in
              PROJECT_STATUS.md|docs/agents/CONTEXT_PACK.md|docs/status/PROJECT_LIVE_STATUS.md|status/facts.json) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): regenerate generated files [skip ci]"
          git push
