[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-trade-assistant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
    "pandas==2.3.3",
    "MetaTrader5==5.0.5735; sys_platform == 'win32'",
    "smartmoneyconcepts==0.0.27",
    "requests==2.34.2",
    "fastapi==0.135.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "ruff==0.16.10",
    "uvicorn==0.41.0",
]
research = ["pyarrow==25.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# `slow` is deselected by default so a plain `pytest -q` terminates deterministically.
# It marks correct, wanted regressions whose runtime is measured in tens of minutes
# (exhaustive historical walks over the full M5 export), not broken or flaky tests.
# Run them explicitly with:  pytest -m slow
markers = [
    "slow: long-running exhaustive historical regression; deselected by default, run with -m slow",
    # `live_mt5` marks tests that genuinely need the real MetaTrader5 package / a
    # connected terminal. It is NOT deselected by default: on the project's Windows
    # dev box (real MT5 installed) these run for real. tests/conftest.py skips them
    # only where the genuine package is absent, so a non-Windows run reports SKIP
    # instead of a misleading FAIL -- and never hides a failure where it is observable.
    "live_mt5: requires the real MetaTrader5 package / a live MT5 terminal",
]
addopts = "-m 'not slow'"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]
